<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Check in</title>
<!-- No SRI hash: Telegram updates this file in place and publishes no hashes. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    /* rem, so iOS Dynamic Type (html.ios below) scales the page; 1rem = 16px elsewhere. */
    --t-small: 0.8125rem; --t-label: 0.9375rem; --t-body: 1rem; --t-button: 1.1875rem; --t-title: 1.5625rem; --t-stamp: 3.0625rem;
    --t-stamp-compact: 1.875rem;
    --r-control: 12px;
    --ease: cubic-bezier(0.2, 0, 0, 1);

    /* Plain-browser fallbacks. Inside Telegram, --tg-theme-* win. */
    --fb-bg: #ffffff; --fb-surface: #f1f2f5; --fb-text: #16181d; --fb-hint: #5f6570;
    --fb-accent: #1f6fb2; --fb-accent-fg: #ffffff; --fb-link: #1f6fb2; --fb-danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fb-bg: #17212b; --fb-surface: #232e3c; --fb-text: #f5f5f5; --fb-hint: #9aa5b1;
      --fb-accent: #5eb5f7; --fb-accent-fg: #0b1620; --fb-link: #6ab3f3; --fb-danger: #ef6b6b;
    }
  }
  :root {
    /* Colour roles, taken from the user's Telegram theme. */
    --bg: var(--tg-theme-bg-color, var(--fb-bg));
    --surface: var(--tg-theme-secondary-bg-color, var(--fb-surface));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --accent: var(--tg-theme-button-color, var(--fb-accent));
    --accent-fg: var(--tg-theme-button-text-color, var(--fb-accent-fg));
    --link: var(--tg-theme-link-color, var(--fb-link));
    --danger: var(--tg-theme-destructive-text-color, var(--fb-danger));
    /* The same roles fitted to the live theme by fitTheme(): WCAG AA, lightness only, hue kept.
       Large text and graphics need 3:1; small text 4.5:1. */
    --surface-ui: var(--c-surface, var(--surface));
    --muted: var(--c-muted, var(--hint));
    --accent-ink: var(--c-accent-ink, var(--accent));   /* 3:1 — stamp ring, large numerals, icons, focus */
    --accent-text: var(--c-accent-text, var(--accent)); /* 4.5:1 — small accent text */
    --button: var(--c-button, var(--accent));           /* 3:1 against its large bold label */
    --link-ink: var(--c-link-ink, var(--link));         /* 3:1 on the surface — large link text */
    --link-text: var(--c-link-text, var(--link));       /* 4.5:1 on the surface — small link text */
    --danger-ink: var(--c-danger-ink, var(--danger));
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  html.ios { font: -apple-system-body; } /* the user's iOS Text Size setting becomes 1rem */
  body {
    font: 400 var(--t-body)/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  ::selection { background: var(--accent); color: var(--accent-fg); }
  /* Screen-reader-only text. Clipped on purpose (text-overflow marks that for the layout audit). */
  .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; text-overflow: ellipsis; }

  .app {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    min-height: 100vh;
    min-height: var(--tg-viewport-stable-height, 100dvh);
    margin: 0 auto;
    padding: var(--s5) var(--s4) 0;
  }
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--s4);
    text-align: center;
    overflow-wrap: anywhere;
  }
  .screen > .mark, .screen > .stamp { margin-bottom: var(--s2); }

  .outcome, .stamp-label { font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; overflow-wrap: normal; }
  .outcome { margin: 0 0 calc(var(--s2) - var(--s4)); font-size: var(--t-label); color: var(--danger-ink); }
  .title { margin: 0; max-width: 18em; font-size: var(--t-title); line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .title:focus { outline: none; }
  .title:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 4px; border-radius: 4px; }
  .line { margin: 0; max-width: 32em; text-wrap: pretty; }
  .hint { margin: 0; max-width: 34em; font-size: var(--t-label); color: var(--muted); text-wrap: pretty; }
  .meta, .notice {
    margin: 0;
    padding: var(--s2) var(--s4);
    font-size: var(--t-label);
    font-weight: 600;
    text-wrap: pretty;
  }
  .meta { border-radius: var(--s4); background: var(--surface-ui); } /* a pill on one line, a soft box when a long name wraps */
  .notice {
    display: flex;
    gap: var(--s2);
    align-items: flex-start;
    border-radius: var(--r-control);
    background: color-mix(in srgb, var(--danger-ink) 10%, var(--bg));
    text-align: left;
  }
  .notice svg { flex: none; width: 1em; height: 1em; margin-top: 0.25em; fill: none; stroke: var(--danger-ink); stroke-width: 2.25; stroke-linecap: round; }
  .placeholder { visibility: hidden; } /* keeps loading screens the same height, so the spinner doesn't jump */
  .outcome.is-unknown { color: var(--text); }

  .mark {
    position: relative;
    display: grid;
    place-items: center;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--surface-ui);
    color: var(--text);
  }
  .mark[data-tone="good"] { color: var(--accent-ink); background: color-mix(in srgb, var(--accent-ink) 12%, var(--bg)); }
  .mark[data-tone="bad"] { color: var(--danger-ink); background: color-mix(in srgb, var(--danger-ink) 14%, var(--bg)); }
  .mark svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* The "no" mirrors the stamp: the same double ring, in the danger colour, with a bare ✕. */
  .mark[data-tone="no"] {
    width: 120px;
    height: 120px;
    border: 3px solid var(--danger-ink);
    color: var(--danger-ink);
    background: color-mix(in srgb, var(--danger-ink) 10%, var(--bg));
    transform: rotate(-4deg);
  }
  .mark[data-tone="no"]::before {
    content: "";
    position: absolute;
    inset: var(--s2);
    border: 1px solid var(--danger-ink);
    border-radius: 50%;
  }
  .mark[data-tone="no"] svg { width: 48px; height: 48px; stroke-width: 2.5; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid color-mix(in srgb, var(--muted) 35%, transparent);
    border-top-color: var(--accent-ink);
    border-radius: 50%;
  }

  /* Signature: the check-in stamp. It is sized in its own em so it grows with large system fonts. */
  .stamp {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--s1);
    width: max(184px, 3.8em);
    height: max(184px, 3.8em);
    border: 3px solid var(--accent-text);
    border-radius: 50%;
    font-size: var(--t-stamp);
    color: var(--accent-text);
    transform: rotate(-4deg);
  }
  .stamp::before {
    content: "";
    position: absolute;
    inset: var(--s2);
    border: 1px solid var(--accent-text);
    border-radius: 50%;
  }
  .stamp-label { font-size: var(--t-small); color: var(--accent-text); }
  /* Smaller while the group picker shares the screen; still the same stamp. Everything inside is
     sized in the stamp's own em, so the label keeps clear of the ring's curve at any text size. */
  .stamp.is-compact { gap: 0; font-size: var(--t-stamp-compact); width: 4.5em; height: 4.5em; }
  .stamp.is-compact .stamp-label { font-size: 0.4em; }
  .stamp-time { font-size: 1em; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow-wrap: normal; }

  /* Group and name, asked once under the stamp. */
  .picker { display: flex; flex-direction: column; gap: var(--s3); width: 100%; max-width: 26rem; margin-top: var(--s2); text-align: left; }
  .field { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s2); }
  .input {
    appearance: none;
    width: 100%;
    min-height: 48px;
    padding: var(--s3) var(--s4);
    border: 1.5px solid var(--muted); /* the field's edge must be visible (3:1), not just its fill */
    border-radius: var(--r-control);
    background: var(--bg);
    color: var(--text);
    font: 400 var(--t-body)/1.3 var(--font); /* 16px+, so iOS doesn't zoom in on focus */
  }
  .input:focus { outline: 2px solid var(--accent-ink); outline-offset: 1px; border-color: var(--accent-ink); }
  .input[aria-invalid="true"] { border-color: var(--danger-ink); }
  .picker-q { margin: 0; font-size: var(--t-body); font-weight: 700; } /* one style for both questions */
  .picker-q:focus { outline: none; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: var(--s3); }
  .choice:last-child:nth-child(odd) { grid-column: 1 / -1; } /* no lone half-width button in the last row */
  .choice {
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--s2);
    min-height: 52px;
    padding: var(--s3) var(--s4);
    border: 1.5px solid var(--muted); /* the same visible edge as the name field */
    border-radius: var(--r-control);
    background: var(--surface-ui);
    color: var(--text);
    font: 700 var(--t-body)/1.25 var(--font);
    text-align: center;
    overflow-wrap: anywhere;
    cursor: pointer;
    transition: transform 120ms var(--ease), filter 120ms var(--ease);
  }
  /* The saved group: tinted, with a tick. Focus keeps its own outline, so the two never look alike. */
  .choice[aria-current="true"] {
    border-color: var(--accent-ink);
    box-shadow: inset 0 0 0 1px var(--accent-ink);
    background: color-mix(in srgb, var(--accent-ink) 14%, var(--bg));
  }
  .choice svg { flex: none; width: 1.1em; height: 1.1em; fill: none; stroke: var(--accent-ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .spinner-sm {
    display: inline-block;
    vertical-align: -0.15em;
    flex: none;
    width: 1em;
    height: 1em;
    border: 2px solid color-mix(in srgb, var(--muted) 35%, transparent);
    border-top-color: var(--accent-ink);
    border-radius: 50%;
  }
  .choice:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
  .choice:active { transform: scale(0.98); filter: brightness(0.92); }
  .choice:disabled { cursor: default; opacity: 0.55; }
  .choice.is-saving { opacity: 1; }
  @media (hover: hover) { .choice:not(:disabled):hover { filter: brightness(0.94); } }
  .field-error { margin: 0; font-size: var(--t-label); font-weight: 600; color: var(--danger-ink); }
  /* The saved group and name, tappable to change. */
  .tag {
    appearance: none;
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    column-gap: var(--s2);
    max-width: 100%;
    min-height: 44px;
    padding: var(--s2) var(--s4);
    border: 0;
    border-radius: var(--s4); /* the same radius as .meta */
    background: var(--surface-ui);
    color: var(--text);
    font: 600 var(--t-label)/1.7 var(--font);
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  .tag-action { color: var(--link-text); font-weight: 700; white-space: nowrap; }
  .tag:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
  .tag:active { filter: brightness(0.92); }
  .meta.is-plain { padding: 0; background: none; color: var(--muted); } /* beside a tappable pill, plain text */

  /* Sticky, so the one action stays reachable when large text makes the screen taller than the phone. */
  .actions {
    position: sticky;
    bottom: 0;
    display: flex;
    flex-direction: column;
    gap: var(--s3);
    padding: var(--s5) 0 calc(var(--s4) + var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
    background: var(--bg);
  }
  .actions:empty { padding: 0 0 var(--s4); }
  @media (max-height: 620px) {
    .app { padding-top: var(--s3); }
    .screen { gap: var(--s3); }
    .mark { width: 72px; height: 72px; }
    .mark svg { width: 32px; height: 32px; }
    .mark[data-tone="no"] { width: 96px; height: 96px; }
    .mark[data-tone="no"] svg { width: 40px; height: 40px; }
    .stamp.is-compact { font-size: calc(var(--t-stamp-compact) * 0.85); }
  }
  .btn {
    appearance: none;
    width: 100%;
    min-height: 48px;
    padding: var(--s3) var(--s4);
    border: 0;
    border-radius: var(--r-control);
    font: 700 var(--t-button)/1.2 var(--font); /* WCAG large text, so Telegram's own button colour can stay */
    cursor: pointer;
    transition: transform 120ms var(--ease), filter 120ms var(--ease);
  }
  .btn-primary { background: var(--button); color: var(--accent-fg); }
  .btn-secondary { background: var(--surface-ui); color: var(--link-ink); }
  .btn:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
  .btn:active { transform: scale(0.98); filter: brightness(0.92); }
  .btn:disabled { cursor: default; opacity: 0.55; }
  .btn.is-saving { opacity: 1; }
  .btn .spinner-sm { margin-left: var(--s2); }
  @media (hover: hover) { .btn:not(:disabled):hover { filter: brightness(0.9); } }

  @media (prefers-reduced-motion: no-preference) {
    .spinner, .spinner-sm { animation: spin 0.9s linear infinite; }
    .stamp.is-new { animation: stamp-in 320ms var(--ease) both; }
    .screen { animation: fade-in 200ms var(--ease) both; }
    .mark.shake { animation: shake 280ms var(--ease); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes stamp-in {
    from { opacity: 0; transform: scale(1.3) rotate(-4deg); }
    to { opacity: 1; transform: scale(1) rotate(-4deg); }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shake {
    25% { transform: translateX(-4px) rotate(-4deg); }
    75% { transform: translateX(4px) rotate(-4deg); }
  }
</style>
</head>
<body>
<main class="app" id="app">
  <p class="visually-hidden" id="status" role="status"></p>
  <section class="screen" id="screen">
    <div class="mark"><div class="spinner" aria-hidden="true"></div></div>
    <h1 class="title">Checking…</h1>
    <noscript><p class="line">This page needs JavaScript. Open it from Telegram on your phone.</p></noscript>
  </section>
  <div class="actions" id="actions"></div>
</main>
<script>
(function () {
  'use strict';

  // The Apps Script web app's /exec URL. Not a secret: security rests on initData verification.
  var API_URL = 'https://script.google.com/macros/s/AKfycbz9ACA6aEHOyvUXNp38ty_ANlMjeDucefyH_mXjXHTGU8AaRKxVBX6jTgnYE9Wahehz/exec';

  var TIMING = {
    retryAfter: 2000,      // one automatic retry on BUSY or an unreadable response
    request: 30000,        // per request
    location: 60000,       // includes the time someone takes to answer a permission prompt
    telegramSilent: 10000, // iOS never answers when Telegram itself lacks location permission
    grace: 5000,           // how long a late Telegram answer may still win after that
    browserLocation: 20000,
    slowHint: 8000,
  };
  var PHONE_PLATFORMS = ['android', 'ios'];
  var APPROXIMATE_M = 1000; // accuracy this coarse means the phone shares an approximate location

  var tg = window.Telegram && window.Telegram.WebApp;
  var appEl = document.getElementById('app');
  var statusEl = document.getElementById('status');
  var screenEl = document.getElementById('screen');
  var actionsEl = document.getElementById('actions');
  var status = null;       // last `status` payload
  var working = false;     // a start or check-in is in flight
  var confirming = false;  // the Start confirmation is showing
  var current = '';        // name of the view on screen
  var renders = 0;
  var denials = 0;         // location refusals in a row
  var settingsOpened = false;
  var flow = 'checkin';    // what a location screen's Try again repeats: 'checkin', 'start' or 'move'
  var lastCheckin = null;  // {atText, closesAtText} of this person's check-in
  var me = null;           // {groups, profile} from the server once checked in (null: not offered)
  var picking = false;     // the group/name picker is open by choice ("Change")
  var savingProfile = false;
  var pickerError = '';
  var nameInvalid = false;
  var draftName = null;    // what they typed, kept across re-renders
  var justMoved = false;   // an admin just moved the check-in point (said once on the next screen)
  var lastDistanceM = 0;   // the admin's distance from the point, for the Move confirmation

  // ---------- views ----------

  function sessionMeta() {
    var s = status && status.activeSession;
    if (!s) return '';
    return 'Open until ' + s.closesAtText + (status.isAdmin && s.startedByName ? ' · started by ' + s.startedByName : '');
  }

  function radiusText() {
    return metres((status && status.radiusM) || 150);
  }

  function metres(m) {
    return m >= 1000 ? (m / 1000).toFixed(1).replace(/\.0$/, '') + ' km' : Math.round(m) + ' m';
  }

  var NOT_CHECKED_IN = 'Not checked in';
  // What a failure means, per flow: a check-in, starting a check-in, or moving its point.
  var OUTCOMES = { checkin: NOT_CHECKED_IN, start: 'Not started', move: 'Not moved' };
  var WHY_LOCATION = {
    start: 'Starting a check-in uses your location as the check-in point. ',
    move: 'Moving the check-in point uses your location. ',
  };

  var views = {
    outside: function () {
      return { state: 'outside', icon: 'send', title: 'Open this from Telegram',
        line: 'Type /checkin in your group chat, then tap 📍 Check in.' };
    },
    sdkFailed: function () {
      return { state: 'sdk-failed', icon: 'alert', tone: 'bad', title: 'Couldn’t load check-in',
        line: 'Check your connection, then reload.',
        actions: [{ label: 'Reload', primary: true, onClick: function () { location.reload(); } }] };
    },
    desktop: function () {
      return { state: 'desktop', icon: 'phone', title: 'Open this on your phone',
        line: 'Check-in uses your phone’s location, so it only works in the Telegram app for Android or iPhone.' };
    },
    notConnected: function () {
      return { state: 'not-connected', icon: 'alert', tone: 'bad', title: 'Not connected yet',
        line: 'The bot owner still needs to set API_URL in web/index.html.' };
    },
    loading: function (title, hint, slowHint) {
      // Loading screens always keep a meta and a hint row (hidden when empty) so their height is fixed.
      return { state: 'loading', spinner: true, title: title, hint: hint || '', slowHint: slowHint, meta: sessionMeta(), reserve: true };
    },
    noSession: function () {
      return { state: 'no-session', icon: 'clock', title: 'No check-in open right now',
        line: 'When an admin opens one, type /checkin in the group and tap 📍 Check in.' };
    },
    closed: function () {
      return { state: 'closed', icon: 'x', tone: 'no', outcome: NOT_CHECKED_IN, title: 'Check-in closed before you got in',
        line: 'If you were there, ask an admin to add you.',
        actions: [{ label: 'Done', onClick: closeApp }] };
    },
    adminIdle: function () {
      var mins = (status && status.sessionMinutes) || 60;
      return { state: 'admin-idle', icon: 'flag', title: 'No check-in open',
        line: 'Start one where you’re standing. Members within ' + radiusText() + ' of you can check in for the next ' + mins + ' minutes.',
        hint: 'Once started, a check-in can’t be ended early.',
        actions: [{ label: 'Start check-in (' + mins + ' min)', primary: true, onClick: startSession }] };
    },
    adminStarted: function (data) {
      // Admins are not checked in automatically, so their own status must not read as done. If the
      // group announcement failed, nobody knows the check-in is open, so sharing the link comes first.
      var checkInAction = { label: 'Check in', primary: true, onClick: checkIn };
      var actions = [checkInAction];
      if (data.warning && data.shareLink) {
        checkInAction.primary = false;
        actions = [{ label: 'Share check-in link', primary: true, onClick: function () { share(data.shareLink); } }, checkInAction];
      }
      return { state: 'admin-started', icon: 'flag', title: 'Check-in started',
        line: 'The check-in point is where you’re standing. You’re not checked in yet: tap Check in to add yourself.',
        meta: 'Open until ' + data.closesAtText, notice: data.warning, actions: actions };
    },
    ready: function (line) {
      var s = status && status.activeSession;
      return { state: 'ready', icon: 'pin', title: 'Check-in is open',
        line: line || 'Tap Check in when you’re at the venue.',
        meta: line && s ? 'Open until ' + s.closesAtText : sessionMeta(), // the line already names the starter
        actions: [{ label: 'Check in', primary: true, onClick: checkIn }] };
    },
    // After the stamp: the group picker (first time, or on Change), else the saved group as a pill.
    checkedIn: function (atText, closesAtText, isNew) {
      var s = status && status.activeSession;
      var asking = picking || profileNeeded();
      var view = { state: asking ? 'profile' : 'checked-in', stamp: atText, stampIsNew: isNew, stampCompact: asking,
        title: 'You’re on the list', line: 'Check-in closes at ' + closesAtText + '.',
        meta: status && status.isAdmin && s && s.startedByName ? 'Started by ' + s.startedByName : '' };
      if (justMoved) {
        view.hint = 'The check-in point is now where you’re standing.';
        justMoved = false;
      }
      if (!asking) {
        if (me && me.profile) {
          view.tag = profileTag();
          view.metaPlain = true; // so only the tappable pill looks like one
        }
        view.actions = [{ label: 'Done', onClick: closeApp }];
        return view;
      }
      var p = me.profile;
      var hasGroups = me.groups.length > 0;
      // Say up front that the check-in is done: the question is extra, not a condition.
      if (!picking) {
        view.line = !p || !p.fullName
          ? 'You’re checked in. One quick question so admins can tell who’s who.'
          : 'You’re checked in. The group list has changed, so please pick yours again.';
      }
      view.say = hasGroups ? 'Which group are you in?' : 'Please confirm your full name.';
      view.body = pickerEl();
      view.actions = [];
      if (!hasGroups) {
        view.actions.push({ label: 'Save name', primary: true, onClick: function (e) { saveProfile('', e.currentTarget); } });
      } else if (picking && p && p.group) {
        // Changing only the name: keep the current group.
        view.actions.push({ label: 'Save', primary: true, onClick: function (e) { saveProfile(p.group, e.currentTarget); } });
      }
      if (!profileNeeded()) view.actions.push({ label: 'Cancel', onClick: closePicker });
      return view;
    },
    // kind: 'checkin', 'start' or 'move' when that action failed; '' for loading the page.
    failed: function (res, retry, kind) {
      var titles = {
        OUT_OF_RANGE: 'You’re too far from the venue',
        LOW_ACCURACY: 'Your location isn’t precise enough',
        NOT_MEMBER: 'Members only',
        BUSY: 'Busy right now',
        NETWORK: 'Couldn’t reach the server',
        NO_SITE: 'Check-in isn’t ready yet',
      };
      var admin = status && status.isAdmin;
      var title = titles[res.code] || 'Something went wrong';
      var actions = [{ label: 'Try again', primary: true, onClick: retry }];
      // Lines are built from the numbers, so they add to the title instead of repeating it.
      var line = res.message;
      var d = res.data || {};
      if (res.code === 'LOW_ACCURACY' && d.accuracyM > APPROXIMATE_M) {
        line = 'Your phone is sharing an approximate location (±' + metres(d.accuracyM) +
          '). Turn on Precise Location for Telegram in your phone’s settings, then try again.';
      } else if (res.code === 'LOW_ACCURACY' && d.accuracyM && d.maxAccuracyM) {
        line = 'Accuracy ±' + metres(d.accuracyM) + ' (needs ±' + metres(d.maxAccuracyM) + '). Move outdoors or near a window, then try again.';
      } else if (res.code === 'OUT_OF_RANGE' && admin && d.distanceM) {
        // An admin may just not have arrived yet, so Try again stays first; but if the check-in was
        // started in the wrong place, they can move it from here.
        lastDistanceM = d.distanceM;
        title = 'You’re too far from the check-in point';
        line = 'You’re ' + metres(d.distanceM) + ' from it. If it was set in the wrong place, you can move it to where you are.';
        actions.push({ label: 'Move check-in point here', onClick: moveHere });
      } else if (res.code === 'OUT_OF_RANGE' && d.radiusM) {
        // Members get a rounded distance, or none (the server keeps the point's location private).
        var far = d.beyondM ? 'more than ' + metres(d.beyondM) : d.distanceM ? (d.rounded ? 'about ' : '') + metres(d.distanceM) : '';
        line = far
          ? 'You’re ' + far + ' from the venue. Check-in works within ' + metres(d.radiusM) + '.'
          : 'You’re not within ' + metres(d.radiusM) + ' of the venue.';
      } else if (res.code === 'NO_SITE' && admin) {
        lastDistanceM = 0;
        line = 'This check-in doesn’t have a check-in point yet. Set it to where you’re standing.';
        actions = [{ label: 'Set check-in point here', primary: true, onClick: moveHere }];
      } else if (res.code === 'NO_SITE') {
        line = 'The check-in point isn’t set yet. Ask an admin to set it, then try again.';
      } else if (res.code === 'NOT_MEMBER') {
        line = 'Only members of this group can check in. Just joined? Try again in a minute.';
      } else if (res.code === 'BUSY') {
        line = 'Lots of people are checking in. Try again in a few seconds.';
      }
      var outcome = OUTCOMES[kind] || '';
      var unknown = !!outcome && res.code === 'NETWORK';
      if (unknown) {
        // After a network failure the server may still have done it, so this is not a "no".
        outcome = 'Not confirmed';
        line = kind === 'checkin' ? 'We couldn’t confirm your check-in. Try again — you won’t be counted twice.'
          : kind === 'start' ? 'We couldn’t confirm the check-in started. Try again — it won’t start twice.'
            : 'We couldn’t confirm the move. Try again.';
      }
      var no = kind === 'checkin' && !unknown; // the ✕ ring mirrors the stamp: check-ins only
      return { state: 'failed', icon: no ? 'x' : 'alert', tone: no ? 'no' : 'bad', outcome: outcome, outcomeUnknown: unknown,
        title: title, line: line, meta: sessionMeta(), actions: actions };
    },
    auth: function (res, kind) {
      var no = kind === 'checkin';
      return { state: 'auth', icon: no ? 'x' : 'lock', tone: no ? 'no' : 'bad', outcome: OUTCOMES[kind] || '',
        title: res.code === 'AUTH_EXPIRED' ? 'This page timed out' : 'Couldn’t verify you',
        line: res.message, actions: [{ label: 'Close', primary: true, onClick: closeApp }] };
    },
    // where: 'bot' = this bot's location permission in Telegram (can open its settings);
    //        'app' = Telegram's own location permission in the phone's settings.
    locationDenied: function (where) {
      var bot = where === 'bot';
      var still = denials > 1 ? 'still ' : '';
      var settings = { label: 'Open settings', primary: !settingsOpened, onClick: openLocationSettings };
      var retry = { label: 'Try again', primary: !bot || settingsOpened, onClick: retryFlow };
      var no = flow === 'checkin'; // the ✕ ring mirrors the stamp: check-ins only
      return { state: 'location-denied', icon: no ? 'x' : 'alert', tone: no ? 'no' : 'bad', outcome: OUTCOMES[flow], shake: denials > 1,
        title: bot ? 'Location access is ' + still + 'off' : 'Location is ' + still + 'off for Telegram',
        line: (WHY_LOCATION[flow] || '') + (bot
          ? 'Allow location for this check-in in Telegram’s settings, then come back and tap Try again.'
          : 'Allow location for Telegram in your phone’s settings, then try again.'),
        meta: sessionMeta(),
        actions: bot ? (settingsOpened ? [retry, settings] : [settings, retry]) : [retry] };
    },
    locationError: function (kind) {
      var no = flow === 'checkin';
      return { state: 'location-error', icon: no ? 'x' : 'alert', tone: no ? 'no' : 'bad', outcome: OUTCOMES[flow],
        title: 'Couldn’t get your location',
        line: (WHY_LOCATION[flow] || '') + (kind === 'timeout'
          ? 'Your phone didn’t return a location in time. Check that Location is on and Telegram may use it, then try again.'
          : 'Turn on Location on your phone, then try again.'),
        meta: sessionMeta(), actions: [{ label: 'Try again', primary: true, onClick: retryFlow }] };
    },
  };

  // ---------- flows ----------

  function start() {
    fitTheme();
    if (!tg) {
      // Opened by Telegram (launch data in the URL) but its script failed to load, e.g. on flaky Wi-Fi.
      if (/tgWebAppData=/.test(location.hash)) {
        themeFromLaunchUrl();
        return render(views.sdkFailed());
      }
      return render(views.outside());
    }
    if (tg.platform === 'ios') document.documentElement.classList.add('ios');
    if (!tg.initData) return render(views.outside());
    tg.ready();
    tg.expand();
    // iOS WebKit only shows :active on touch when a touchstart listener exists.
    document.addEventListener('touchstart', function () {}, { passive: true });
    if (tg.onEvent) {
      tg.onEvent('themeChanged', fitTheme);
      // Android reports a permission change. iOS may report nothing, so there Try again becomes the
      // primary button after Open settings; if the client does report activation, retry once.
      tg.onEvent('locationManagerUpdated', function () {
        var lm = tg.LocationManager;
        if (current === 'location-denied' && lm && lm.isAccessGranted) retryFlow();
      });
      tg.onEvent('activated', function () {
        if (current === 'location-denied' && settingsOpened) retryFlow();
      });
    }
    if (PHONE_PLATFORMS.indexOf(tg.platform) === -1) return render(views.desktop());
    if (API_URL.indexOf('PASTE_') !== -1) return render(views.notConnected());
    loadStatus(true);
  }

  // Telegram passes the theme in the launch URL too; use it when its script could not load.
  function themeFromLaunchUrl() {
    try {
      var m = /[#&]tgWebAppThemeParams=([^&]*)/.exec(location.hash);
      var theme = m ? JSON.parse(decodeURIComponent(m[1])) : null;
      if (!theme) return;
      Object.keys(theme).forEach(function (k) {
        document.documentElement.style.setProperty('--tg-theme-' + k.split('_').join('-'), theme[k]);
      });
      fitTheme();
    } catch (e) { /* keep the fallback palette */ }
  }

  function loadStatus(autoCheckIn, readyLine) {
    render(views.loading('Checking…'));
    return api('status').then(function (res) {
      if (!res.ok) return fail(res, function () { loadStatus(autoCheckIn, readyLine); }, '');
      status = res.data;
      var s = status.activeSession;
      if (!s) return render(status.isAdmin ? views.adminIdle() : views.noSession());
      if (status.myCheckin) {
        rememberCheckin({ atText: status.myCheckin.atText, closesAtText: s.closesAtText, groups: status.groups, profile: status.profile });
        return render(views.checkedIn(status.myCheckin.atText, s.closesAtText, false));
      }
      // The group tap should be the only tap: try straight away.
      if (autoCheckIn) return checkIn();
      render(views.ready(readyLine));
    });
  }

  function startSession() {
    if (working || confirming) return; // a double tap must not stack a second confirmation
    confirming = true;
    var mins = (status && status.sessionMinutes) || 60;
    confirmDialog('Start a ' + mins + '-minute check-in here? Members will need to be within ' + radiusText() +
      ' of where you’re standing. It can’t be ended early.').then(function (ok) {
      confirming = false;
      if (!ok || working) return;
      startHere();
    });
  }

  // The admin's own position becomes the check-in point.
  function startHere() {
    if (working) return;
    working = true;
    locate('start', function (fix) {
      render(views.loading('Starting check-in…'));
      api('startSession', { location: sendable(fix) }).then(function (res) {
        working = false;
        if (res.code === 'SESSION_STARTED') {
          haptic('success');
          status.activeSession = res.data;
          // data.warning explains e.g. that the group announcement could not be sent.
          return render(views.adminStarted(res.data));
        }
        if (res.code === 'SESSION_ACTIVE') {
          // Another admin got there first: say so, and that this admin is not checked in yet.
          var by = (res.data && res.data.startedByName) || 'Another admin';
          return loadStatus(false, by + ' already started this check-in. You’re not checked in yet.');
        }
        fail(res, startHere, 'start');
      });
    });
  }

  function moveHere() {
    if (working || confirming) return;
    confirming = true;
    confirmDialog(lastDistanceM
      ? 'Move the check-in point ' + metres(lastDistanceM) + ', to where you’re standing? Members near the old spot won’t be able to check in.'
      : 'Set the check-in point to where you’re standing? Members within ' + radiusText() + ' of you can then check in.').then(function (ok) {
      confirming = false;
      if (!ok || working) return;
      moveNow();
    });
  }

  function moveNow() {
    if (working) return;
    working = true;
    locate('move', function (fix) {
      render(views.loading('Moving the check-in point…'));
      api('moveSite', { location: sendable(fix) }).then(function (res) {
        if (res.code === 'SITE_MOVED') {
          haptic('success');
          justMoved = true;
          // The admin is standing on the new point, so the same fix checks them in.
          if (!status.myCheckin) return submit(fix, true);
          working = false;
          return showCheckedIn(false);
        }
        working = false;
        if (res.code === 'NO_ACTIVE_SESSION') return loadStatus(false);
        fail(res, moveNow, 'move');
      });
    });
  }

  function retryFlow() {
    if (flow === 'start') return startHere();
    if (flow === 'move') return moveNow();
    checkIn();
  }

  // Gets a location for `purpose`, then calls onFix. Location problems are shown here, and their
  // Try again repeats the same purpose.
  function locate(purpose, onFix) {
    flow = purpose;
    render(views.loading('Getting your location…', 'If Telegram asks, allow location access.',
      'Still looking for your location. Check that Location is on.'));
    (purpose === 'checkin' ? getLocation() : freshLocation()).then(function (fix) {
      denials = 0;
      onFix(fix);
    }, function (err) {
      working = false;
      haptic('error');
      if (err.kind === 'denied') {
        denials++;
        return render(views.locationDenied(err.where));
      }
      render(views.locationError(err.kind));
    });
  }

  function sendable(fix) {
    return { lat: fix.lat, lng: fix.lng, accuracy: fix.accuracy };
  }

  function checkIn() {
    if (working) return;
    working = true;
    locate('checkin', function (fix) { submit(fix, false); });
  }

  function submit(fix, isFreshRetry) {
    render(views.loading('Checking you in…'));
    return api('checkin', { location: sendable(fix) }).then(function (res) {
      if (res.code === 'CHECKED_IN' || res.code === 'ALREADY_CHECKED_IN') {
        working = false;
        haptic('success');
        status.myCheckin = { at: res.data.at, atText: res.data.atText };
        rememberCheckin(res.data);
        return showCheckedIn(true);
      }
      // Telegram for Android answers with the phone's cached last-known fix, which can be stale. If it
      // lands too far away or too rough, get one fresh fix before saying no. (Only here, because the
      // fresh fix costs a Telegram permission prompt on Android.)
      if (fix.source === 'telegram' && tg.platform === 'android' && !isFreshRetry &&
          (res.code === 'OUT_OF_RANGE' || res.code === 'LOW_ACCURACY')) {
        render(views.loading('Getting a fresh location…', 'If Telegram asks, allow location access.'));
        return browserLocation().then(function (fresh) { return submit(fresh, true); }, function () {
          working = false;
          fail(res, checkIn, 'checkin');
        });
      }
      working = false;
      if (res.code === 'NO_ACTIVE_SESSION') {
        haptic('error');
        return render(views.closed());
      }
      fail(res, checkIn, 'checkin');
    });
  }

  function fail(res, retry, kind) {
    haptic('error');
    if (res.code === 'AUTH_FAILED' || res.code === 'AUTH_EXPIRED') return render(views.auth(res, kind));
    if (res.code === 'UNSUPPORTED_PLATFORM') return render(views.desktop());
    render(views.failed(res, retry, kind));
  }

  // ---------- group and full name ----------

  function rememberCheckin(data) {
    lastCheckin = { atText: data.atText, closesAtText: data.closesAtText };
    // A server without groups support sends no list; then nothing is asked.
    if (Array.isArray(data.groups)) me = { groups: data.groups, profile: data.profile || null };
  }

  function showCheckedIn(isNew) {
    render(views.checkedIn(lastCheckin.atText, lastCheckin.closesAtText, isNew));
  }

  function profileNeeded() {
    if (!me) return false;
    var p = me.profile;
    return !p || !p.fullName || (me.groups.length > 0 && !p.group);
  }

  function telegramName() {
    var u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    return u ? [u.first_name, u.last_name].filter(Boolean).join(' ') : '';
  }

  function closePicker() {
    picking = false;
    pickerError = '';
    nameInvalid = false;
    draftName = null;
    showCheckedIn(false);
    focusFirst('.tag');
  }

  function focusFirst(selector) {
    var node = document.querySelector(selector);
    if (node) node.focus();
  }

  function profileTag() {
    var p = me.profile;
    var now = [p.group, p.fullName].filter(Boolean);
    var b = el('button', 'tag');
    b.type = 'button';
    b.setAttribute('aria-label', 'Change group or name (now ' + now.join(', ') + ')');
    b.appendChild(el('span', '', now.join(' · ')));
    b.appendChild(el('span', 'tag-action', 'Change'));
    b.addEventListener('click', function () {
      picking = true;
      showCheckedIn(false);
      // Most changes are a group: land on the question, not the name field, so no keyboard pops up.
      focusFirst(me.groups.length ? '#group-q' : '#full-name');
    });
    return b;
  }

  function pickerEl() {
    var p = me.profile;
    var box = el('div', 'picker');
    var firstTime = !p || !p.fullName;
    if (firstTime || picking) {
      var field = el('div', 'field');
      var label = el('label', 'picker-q', 'Your full name');
      label.htmlFor = 'full-name';
      var input = el('input', 'input');
      input.id = 'full-name';
      input.type = 'text';
      input.autocomplete = 'name';
      input.autocapitalize = 'words';
      input.spellcheck = false;
      input.maxLength = 60;
      input.setAttribute('enterkeyhint', 'done');
      input.value = draftName !== null ? draftName : (p && p.fullName) || telegramName();
      if (nameInvalid) {
        input.setAttribute('aria-invalid', 'true');
        input.setAttribute('aria-describedby', 'name-error');
      }
      input.addEventListener('input', function () { draftName = input.value; });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      });
      field.appendChild(label);
      field.appendChild(input);
      if (nameInvalid) {
        var err = el('p', 'field-error', 'Enter your full name first.');
        err.id = 'name-error';
        field.appendChild(err);
      }
      box.appendChild(field);
    }
    if (me.groups.length) {
      var q = el('p', 'picker-q', 'Which group are you in?');
      q.id = 'group-q';
      q.tabIndex = -1;
      box.appendChild(q);
      var grid = el('div', 'choices');
      grid.setAttribute('role', 'group');
      grid.setAttribute('aria-labelledby', 'group-q');
      me.groups.forEach(function (g) {
        var b = el('button', 'choice');
        b.type = 'button';
        if (p && p.group === g) {
          b.setAttribute('aria-current', 'true');
          b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
        }
        b.appendChild(el('span', '', g));
        b.addEventListener('click', function () { saveProfile(g, b); });
        grid.appendChild(b);
      });
      box.appendChild(grid);
    }
    if (pickerError) {
      var notice = noticeEl(pickerError);
      notice.id = 'picker-error';
      notice.tabIndex = -1;
      box.appendChild(notice);
    }
    return box;
  }

  function saveProfile(group, button) {
    if (savingProfile) return;
    var input = document.getElementById('full-name');
    var name = (input ? input.value : (me.profile && me.profile.fullName) || '').replace(/\s+/g, ' ').trim();
    if (!name) {
      nameInvalid = true;
      pickerError = '';
      showCheckedIn(false);
      statusEl.textContent = 'Enter your full name first.';
      focusFirst('#full-name');
      return;
    }
    savingProfile = true;
    draftName = input ? input.value : null;
    Array.prototype.forEach.call(document.querySelectorAll('.choice, #actions button, #full-name'), function (c) { c.disabled = true; });
    if (button) {
      // Keep the chosen group readable; the spinner says it's on its way.
      button.classList.add('is-saving');
      button.setAttribute('aria-busy', 'true');
      var spin = el('span', 'spinner-sm');
      spin.setAttribute('aria-hidden', 'true');
      button.appendChild(spin);
    }
    statusEl.textContent = 'Saving…';
    var id = renders;
    setTimeout(function () {
      if (savingProfile && renders === id) statusEl.textContent = 'Still saving. A slow connection can take a little while.';
    }, TIMING.slowHint);
    api('saveProfile', { fullName: name, group: group }).then(function (res) {
      savingProfile = false;
      if (res.code === 'PROFILE_SAVED') {
        haptic('success');
        me = { groups: res.data.groups, profile: res.data.profile };
        picking = false;
        pickerError = '';
        nameInvalid = false;
        draftName = null;
        showCheckedIn(false);
        var p = me.profile;
        statusEl.textContent = 'Saved: ' + [p.group, p.fullName].filter(Boolean).join(', ') + '.';
        focusFirst('.tag');
        return;
      }
      haptic('error');
      if (res.code === 'INVALID_GROUP' && res.data && Array.isArray(res.data.groups)) me.groups = res.data.groups;
      nameInvalid = res.code === 'INVALID_NAME';
      // Whatever went wrong, the check-in itself stands; say so.
      pickerError = res.code === 'NETWORK' || res.code === 'BUSY'
        ? 'Couldn’t save that. You’re still checked in; tap your group again.'
        : res.message;
      picking = picking || !profileNeeded();
      showCheckedIn(false);
      statusEl.textContent = pickerError;
      focusFirst(nameInvalid ? '#full-name' : '#picker-error');
    });
  }

  // ---------- backend ----------

  // text/plain keeps this a CORS "simple request" (no preflight, which Apps Script can't answer).
  function api(action, extra, isRetry) {
    var body = { action: action, initData: tg.initData, platform: tg.platform };
    if (extra) for (var k in extra) body[k] = extra[k];
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMING.request) : null;
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined,
    })
      .then(function (r) { return r.json(); })
      .catch(function () { return null; })
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res || typeof res.code !== 'string') {
          // Offline, timed out, or Apps Script answered with an HTML error page (e.g. overloaded).
          res = { ok: false, code: 'NETWORK', message: 'Check your connection and try again.' };
        }
        if ((res.code === 'BUSY' || res.code === 'NETWORK') && !isRetry) {
          if (current === 'loading') setTitle('Trying again…');
          return sleep(TIMING.retryAfter).then(function () { return api(action, extra, true); });
        }
        return res;
      });
  }

  // ---------- location (device GPS only; never a map or manual input) ----------

  function getLocation() {
    var lm = tg.LocationManager;
    if (!lm || !tg.isVersionAtLeast || !tg.isVersionAtLeast('8.0')) return browserLocation();
    return telegramLocation(lm);
  }

  // For the check-in point itself. Telegram for Android can answer with a cached fix of any age,
  // which would put the point wherever the admin last was; there, a fresh browser fix is taken
  // too (one more permission prompt, once per start), falling back to Telegram's if it fails.
  function freshLocation() {
    return getLocation().then(function (fix) {
      if (tg.platform !== 'android' || fix.source !== 'telegram') return fix;
      return browserLocation().then(function (fresh) { return fresh; }, function () { return fix; });
    });
  }

  function telegramLocation(lm) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timers = [];
      timers.push(setTimeout(function () { finish(reject, { kind: 'timeout' }); }, TIMING.location));
      function finish(fn, value) {
        if (settled) return;
        settled = true;
        timers.forEach(clearTimeout);
        fn(value);
      }
      function request() {
        try {
          if (!lm.isLocationAvailable) {
            return browserLocation().then(function (v) { finish(resolve, v); }, function (e) { finish(reject, e); });
          }
          // iOS sends no answer at all when Telegram lacks the phone's location permission. Once this
          // bot has asked before (so no first-run sheet is being read), ask the browser API, which
          // fails at once in that case; a late Telegram answer still wins during a short grace period.
          if (tg.platform === 'ios' && lm.isAccessRequested) {
            timers.push(setTimeout(function () {
              browserLocation().then(function (fix) { finish(resolve, fix); }, function (e) {
                if (e.kind !== 'denied') return;
                timers.push(setTimeout(function () { finish(reject, { kind: 'denied', where: 'app' }); }, TIMING.grace));
              });
            }, TIMING.telegramSilent));
          }
          lm.getLocation(function (data) {
            if (!data) {
              // null: either this bot's permission was refused, or it is granted but the phone can't
              // give a location (e.g. Location switched off), where settings would not help.
              return finish(reject, lm.isAccessGranted ? { kind: 'unavailable' } : { kind: 'denied', where: 'bot' });
            }
            var fix = { lat: data.latitude, lng: data.longitude, accuracy: data.horizontal_accuracy, source: 'telegram' };
            if (typeof fix.accuracy === 'number') return finish(resolve, fix);
            // Telegram gave no accuracy; the browser's fix always has one.
            browserLocation().then(function (v) { finish(resolve, v); }, function () { finish(resolve, fix); });
          });
        } catch (e) {
          finish(reject, { kind: 'unavailable' });
        }
      }
      try {
        if (lm.isInited) request(); else lm.init(request);
      } catch (e) {
        finish(reject, { kind: 'unavailable' });
      }
    });
  }

  function browserLocation() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) return reject({ kind: 'unavailable' });
      var settled = false;
      var guard = setTimeout(function () { done(reject, { kind: 'timeout' }); }, TIMING.browserLocation);
      function done(fn, v) { if (!settled) { settled = true; clearTimeout(guard); fn(v); } }
      navigator.geolocation.getCurrentPosition(function (p) {
        done(resolve, { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy, source: 'browser' });
      }, function (e) {
        done(reject, e.code === 1 ? { kind: 'denied', where: 'app' } : { kind: e.code === 3 ? 'timeout' : 'unavailable' });
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    });
  }

  function openLocationSettings() {
    var lm = tg.LocationManager;
    settingsOpened = true;
    try {
      // The SDK only opens settings when access was asked for and refused; otherwise just retry.
      if (!lm || !lm.isAccessRequested || lm.isAccessGranted) return retryFlow();
      lm.openSettings();
    } catch (e) {
      return render(views.locationDenied('app'));
    }
    render(views.locationDenied('bot'));
  }

  // ---------- Telegram helpers ----------

  function confirmDialog(message) {
    return new Promise(function (resolve) {
      if (message.length > 256) message = message.slice(0, 255) + '…'; // Telegram refuses longer popups
      if (!tg.isVersionAtLeast || !tg.isVersionAtLeast('6.2')) return resolve(window.confirm(message));
      try {
        tg.showConfirm(message, function (ok) { resolve(!!ok); });
      } catch (e) {
        resolve(false); // e.g. a popup is already open: never stack a second dialog
      }
    });
  }

  function share(link) {
    var url = 'https://t.me/share/url?url=' + encodeURIComponent(link);
    try { tg.openTelegramLink(url); } catch (e) { window.open(url, '_blank'); }
  }

  function haptic(type) {
    try { tg.HapticFeedback.notificationOccurred(type); } catch (e) { /* unsupported client */ }
  }

  function closeApp() {
    try { tg.close(); } catch (e) { /* nothing to close */ }
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // ---------- rendering (textContent only: names come from users) ----------

  var ICONS = {
    phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    send: '<path d="M21 3 3 10.5l7 2.5 2.5 7z"/><path d="M10 13 21 3"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    flag: '<path d="M6.5 21V4h11l-2 4 2 4h-11"/>',
    pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.5h.01"/>',
    x: '<path d="M7 7l10 10"/><path d="M17 7 7 17"/>',
  };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function markEl(view) {
    var mark = el('div', 'mark' + (view.shake ? ' shake' : ''));
    if (view.tone) mark.setAttribute('data-tone', view.tone);
    if (view.spinner) {
      var spinner = el('div', 'spinner');
      spinner.setAttribute('aria-hidden', 'true');
      mark.appendChild(spinner);
    } else {
      mark.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[view.icon] + '</svg>';
    }
    return mark;
  }

  function stampEl(atText, isNew, compact) {
    var stamp = el('div', 'stamp' + (isNew ? ' is-new' : '') + (compact ? ' is-compact' : ''));
    stamp.setAttribute('aria-hidden', 'true'); // announced through the title
    stamp.appendChild(el('span', 'stamp-label', 'Checked in'));
    stamp.appendChild(el('span', 'stamp-time', atText));
    return stamp;
  }

  function noticeEl(text) {
    var p = el('p', 'notice');
    p.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS.alert + '</svg>';
    p.appendChild(el('span', '', text));
    return p;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function setTitle(text) {
    var h = screenEl.querySelector('.title');
    if (h) h.lastChild.textContent = text;
  }

  function render(view) {
    // Keep keyboard and screen-reader users in place: if focus was in the app, move it to the new screen.
    var hadFocus = document.activeElement && document.activeElement !== document.body && appEl.contains(document.activeElement);
    var id = ++renders;
    current = view.state;
    document.body.setAttribute('data-state', view.state);
    clear(screenEl);
    screenEl.appendChild(view.stamp ? stampEl(view.stamp, view.stampIsNew, view.stampCompact) : markEl(view));
    if (view.outcome) {
      var outcome = el('p', 'outcome' + (view.outcomeUnknown ? ' is-unknown' : ''), view.outcome);
      outcome.setAttribute('aria-hidden', 'true'); // announced through the title
      screenEl.appendChild(outcome);
    }
    // The title carries the answer for screen readers, so focus on it reads "Not checked in: …".
    var answer = view.stamp ? 'Checked in at ' + view.stamp + '. ' : view.outcome ? view.outcome + ': ' : '';
    var title = el('h1', 'title');
    if (answer) title.appendChild(el('span', 'visually-hidden', answer));
    title.appendChild(document.createTextNode(view.title));
    title.tabIndex = -1;
    screenEl.appendChild(title);
    if (view.line) screenEl.appendChild(el('p', 'line', view.line));
    if (view.tag) screenEl.appendChild(view.tag);
    if (view.meta || view.reserve) {
      screenEl.appendChild(el('p', 'meta' + (view.meta ? '' : ' placeholder') + (view.metaPlain ? ' is-plain' : ''), view.meta || '\u00a0'));
    }
    if (view.body) screenEl.appendChild(view.body);
    if (view.notice) screenEl.appendChild(noticeEl(view.notice));
    if (view.hint || view.reserve) screenEl.appendChild(el('p', 'hint' + (view.hint ? '' : ' placeholder'), view.hint || '\u00a0'));
    clear(actionsEl);
    var primary = null;
    (view.actions || []).forEach(function (a) {
      var b = el('button', 'btn ' + (a.primary ? 'btn-primary' : 'btn-secondary'), a.label);
      b.type = 'button';
      b.addEventListener('click', a.onClick);
      actionsEl.appendChild(b);
      if (a.primary && !primary) primary = b;
    });
    // One sentence for screen readers, instead of re-reading the whole screen on every change.
    statusEl.textContent = answer + view.title + (view.line ? '. ' + view.line : '') + (view.say ? ' ' + view.say : '') +
      (view.hint && view.state !== 'loading' ? ' ' + view.hint : '');
    if (hadFocus) (primary || title).focus();
    if (view.state === 'loading') {
      // Slow venue Wi-Fi, a slow GPS fix or an Apps Script cold start: say it is still working.
      setTimeout(function () {
        if (renders !== id) return;
        var text = view.slowHint || 'Still working. A slow connection can take a little while.';
        var empty = screenEl.querySelector('.hint.placeholder');
        if (empty) {
          empty.textContent = text;
          empty.classList.remove('placeholder');
        } else {
          screenEl.appendChild(el('p', 'hint', text));
        }
      }, TIMING.slowHint);
    }
  }

  // ---------- colours: keep the user's theme, but never below WCAG AA ----------

  function fitTheme() {
    var root = document.documentElement;
    ['--c-surface', '--c-muted', '--c-accent-ink', '--c-accent-text', '--c-button', '--c-link-ink', '--c-link-text', '--c-danger-ink'].forEach(function (p) {
      root.style.removeProperty(p);
    });
    var probe = document.createElement('span');
    probe.style.display = 'none';
    document.body.appendChild(probe);
    function read(token) {
      probe.style.color = 'var(' + token + ')';
      var m = getComputedStyle(probe).color.match(/[\d.]+/g) || ['0', '0', '0'];
      return [Number(m[0]), Number(m[1]), Number(m[2])];
    }
    function set(prop, rgb) { root.style.setProperty(prop, 'rgb(' + rgb.join(',') + ')'); }
    var bg = read('--bg');
    var text = read('--text');
    var surface = read('--surface');
    // Dark themes (Telegram's own) often make secondary surfaces darker than the page, so buttons and
    // discs sink out of sight. Lift them slightly toward the text colour instead.
    if (luminance(bg) < 0.2 && (luminance(surface) <= luminance(bg) || contrast(surface, bg) < 1.15)) {
      surface = bg.map(function (v, i) { return Math.round(v + (text[i] - v) * 0.1); });
      set('--c-surface', surface);
    }
    var accent = read('--accent');
    set('--c-muted', readable(read('--hint'), [bg, surface], 4.5));
    set('--c-accent-ink', readable(accent, [bg, surface], 3));
    set('--c-accent-text', readable(accent, [bg], 4.5));
    set('--c-link-ink', readable(read('--link'), [surface], 3)); // secondary button labels are large text
    set('--c-link-text', readable(read('--link'), [surface], 4.5));
    set('--c-danger-ink', readable(read('--danger'), [bg, surface], 4.5));
    set('--c-button', readable(accent, [read('--accent-fg')], 3)); // its label is large bold text
    probe.remove();
  }

  // Changes only the lightness (OKLCH) of `color` until it reaches `min` contrast against every
  // background, so the theme's hue survives; chroma is reduced only as far as sRGB requires.
  function readable(color, backgrounds, min) {
    function ok(c) { return backgrounds.every(function (b) { return contrast(c, b) >= min; }); }
    if (ok(color)) return color;
    var lab = toOklab(color);
    var chroma = Math.sqrt(lab[1] * lab[1] + lab[2] * lab[2]);
    var hue = Math.atan2(lab[2], lab[1]);
    var dir = luminance(backgrounds[0]) > 0.18 ? -1 : 1; // darken on light backgrounds, lighten on dark
    for (var L = lab[0] + dir * 0.01; L > 0 && L < 1; L += dir * 0.01) {
      var c = fromOklch(L, chroma, hue);
      if (ok(c)) return c;
    }
    return dir < 0 ? [0, 0, 0] : [255, 255, 255];
  }

  function toLinear(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function toByte(v) { return Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055)); }

  function toOklab(rgb) {
    var r = toLinear(rgb[0]), g = toLinear(rgb[1]), b = toLinear(rgb[2]);
    var l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    var m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    var s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
  }

  function oklabToLinear(L, a, b) {
    var l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
    var m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
    var s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
    return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
  }

  function fromOklch(L, chroma, hue) {
    for (var c = chroma; c >= 0; c -= 0.005) {
      var lin = oklabToLinear(L, c * Math.cos(hue), c * Math.sin(hue));
      if (lin.every(function (v) { return v >= -0.0005 && v <= 1.0005; })) {
        return lin.map(function (v) { return toByte(Math.min(1, Math.max(0, v))); });
      }
    }
    return oklabToLinear(L, 0, 0).map(function (v) { return toByte(Math.min(1, Math.max(0, v))); });
  }

  function luminance(rgb) {
    var c = rgb.map(function (v) {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }

  function contrast(a, b) {
    var la = luminance(a);
    var lb = luminance(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }

  start();
})();
</script>
