<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Check in</title>
<!-- No SRI hash: Telegram updates this file in place and publishes no hashes. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --t-small: 13px; --t-label: 15px; --t-body: 16px; --t-button: 19px; --t-title: 25px; --t-stamp: 49px;
    --r-control: 12px;
    --ease: cubic-bezier(0.2, 0, 0, 1);

    /* Plain-browser fallbacks. Inside Telegram, --tg-theme-* win. */
    --fb-bg: #ffffff; --fb-surface: #f1f2f5; --fb-text: #16181d; --fb-hint: #5f6570;
    --fb-accent: #1f6fb2; --fb-accent-fg: #ffffff; --fb-link: #1f6fb2; --fb-danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fb-bg: #17212b; --fb-surface: #232e3c; --fb-text: #f5f5f5; --fb-hint: #9aa5b1;
      --fb-accent: #5eb5f7; --fb-accent-fg: #0b1620; --fb-link: #6ab3f3; --fb-danger: #ef6b6b;
    }
  }
  :root {
    /* Colour roles, taken from the user's Telegram theme. */
    --bg: var(--tg-theme-bg-color, var(--fb-bg));
    --surface: var(--tg-theme-secondary-bg-color, var(--fb-surface));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --accent: var(--tg-theme-button-color, var(--fb-accent));
    --accent-fg: var(--tg-theme-button-text-color, var(--fb-accent-fg));
    --link: var(--tg-theme-link-color, var(--fb-link));
    --danger: var(--tg-theme-destructive-text-color, var(--fb-danger));
    /* The same roles fitted to the live theme by fitTheme(): WCAG AA, lightness only, hue kept.
       Large text and graphics need 3:1; small text 4.5:1. */
    --surface-ui: var(--c-surface, var(--surface));
    --muted: var(--c-muted, var(--hint));
    --accent-ink: var(--c-accent-ink, var(--accent));   /* 3:1 — stamp ring, large numerals, icons, focus */
    --accent-text: var(--c-accent-text, var(--accent)); /* 4.5:1 — small accent text */
    --button: var(--c-button, var(--accent));           /* 3:1 against its large bold label */
    --link-ink: var(--c-link-ink, var(--link));
    --danger-ink: var(--c-danger-ink, var(--danger));
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 400 var(--t-body)/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  ::selection { background: var(--accent); color: var(--accent-fg); }
  /* Screen-reader-only text. Clipped on purpose (text-overflow marks that for the layout audit). */
  .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; text-overflow: ellipsis; }

  .app {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    min-height: 100vh;
    min-height: var(--tg-viewport-stable-height, 100dvh);
    margin: 0 auto;
    padding: var(--s5) var(--s4) calc(var(--s4) + var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
  }
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--s4);
    text-align: center;
    overflow-wrap: anywhere;
  }
  .screen > .mark, .screen > .stamp { margin-bottom: var(--s2); }

  .outcome, .stamp-label { font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; overflow-wrap: normal; }
  .outcome { margin: 0 0 calc(var(--s2) - var(--s4)); font-size: var(--t-label); color: var(--danger-ink); }
  .title { margin: 0; max-width: 18em; font-size: var(--t-title); line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .title:focus { outline: none; }
  .title:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 4px; border-radius: 4px; }
  .line { margin: 0; max-width: 32em; text-wrap: pretty; }
  .hint { margin: 0; max-width: 34em; font-size: var(--t-small); color: var(--muted); text-wrap: pretty; }
  .meta, .notice {
    margin: 0;
    padding: var(--s2) var(--s4);
    border-radius: var(--s4); /* a pill on one line, a soft box when a long name wraps */
    background: var(--surface-ui);
    font-size: var(--t-small);
    font-weight: 600;
    text-wrap: pretty;
  }
  .notice { display: flex; gap: var(--s2); align-items: flex-start; text-align: left; }
  .notice svg { flex: none; width: 16px; height: 16px; margin-top: 2px; fill: none; stroke: var(--danger-ink); stroke-width: 2.25; stroke-linecap: round; }

  .mark {
    position: relative;
    display: grid;
    place-items: center;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--surface-ui);
    color: var(--text);
  }
  .mark[data-tone="good"] { color: var(--accent-ink); background: color-mix(in srgb, var(--accent-ink) 12%, var(--bg)); }
  .mark[data-tone="bad"] { color: var(--danger-ink); background: color-mix(in srgb, var(--danger-ink) 14%, var(--bg)); }
  .mark svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* The "no" mirrors the stamp: the same double ring, in the danger colour, with a bare ✕. */
  .mark[data-tone="no"] {
    width: 120px;
    height: 120px;
    border: 3px solid var(--danger-ink);
    color: var(--danger-ink);
    background: color-mix(in srgb, var(--danger-ink) 10%, var(--bg));
    transform: rotate(-4deg);
  }
  .mark[data-tone="no"]::before {
    content: "";
    position: absolute;
    inset: var(--s2);
    border: 1px solid var(--danger-ink);
    border-radius: 50%;
  }
  .mark[data-tone="no"] svg { width: 48px; height: 48px; stroke-width: 2.5; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid color-mix(in srgb, var(--muted) 35%, transparent);
    border-top-color: var(--accent-ink);
    border-radius: 50%;
  }

  /* Signature: the check-in stamp. It is sized in its own em so it grows with large system fonts. */
  .stamp {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--s1);
    width: max(184px, 3.8em);
    height: max(184px, 3.8em);
    border: 3px solid var(--accent-ink);
    border-radius: 50%;
    font-size: var(--t-stamp);
    color: var(--accent-ink);
    transform: rotate(-4deg);
  }
  .stamp::before {
    content: "";
    position: absolute;
    inset: var(--s2);
    border: 1px solid var(--accent-ink);
    border-radius: 50%;
  }
  .stamp-label { font-size: var(--t-small); color: var(--accent-text); }
  .stamp-time { font-size: 1em; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow-wrap: normal; }

  .actions { display: flex; flex-direction: column; gap: var(--s3); padding-top: var(--s5); }
  .actions:empty { display: none; }
  .btn {
    appearance: none;
    width: 100%;
    min-height: 48px;
    padding: var(--s3) var(--s4);
    border: 0;
    border-radius: var(--r-control);
    font: 700 var(--t-button)/1.2 var(--font); /* WCAG large text, so Telegram's own button colour can stay */
    cursor: pointer;
    transition: transform 120ms var(--ease), filter 120ms var(--ease);
  }
  .btn-primary { background: var(--button); color: var(--accent-fg); }
  .btn-secondary { background: var(--surface-ui); color: var(--link-ink); }
  .btn:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
  .btn:active { transform: scale(0.98); filter: brightness(0.92); }
  .btn:disabled { cursor: default; opacity: 0.55; }
  @media (hover: hover) { .btn:not(:disabled):hover { filter: brightness(0.95); } }

  @media (prefers-reduced-motion: no-preference) {
    .spinner { animation: spin 0.9s linear infinite; }
    .stamp.is-new { animation: stamp-in 320ms var(--ease) both; }
    .screen { animation: fade-in 200ms var(--ease) both; }
    .mark.shake { animation: shake 280ms var(--ease); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes stamp-in {
    from { opacity: 0; transform: scale(1.3) rotate(-4deg); }
    to { opacity: 1; transform: scale(1) rotate(-4deg); }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shake {
    25% { transform: translateX(-4px) rotate(-4deg); }
    75% { transform: translateX(4px) rotate(-4deg); }
  }
</style>
</head>
<body>
<main class="app" id="app">
  <p class="visually-hidden" id="status" role="status"></p>
  <section class="screen" id="screen">
    <div class="mark"><div class="spinner" aria-hidden="true"></div></div>
    <h1 class="title">Checking…</h1>
    <noscript><p class="line">This page needs JavaScript. Open it from Telegram on your phone.</p></noscript>
  </section>
  <div class="actions" id="actions"></div>
</main>
<script>
(function () {
  'use strict';

  // The Apps Script web app's /exec URL. Not a secret: security rests on initData verification.
  var API_URL = 'https://script.google.com/macros/s/AKfycbz9ACA6aEHOyvUXNp38ty_ANlMjeDucefyH_mXjXHTGU8AaRKxVBX6jTgnYE9Wahehz/exec';

  var TIMING = {
    retryAfter: 2000,      // one automatic retry on BUSY or an unreadable response
    request: 30000,        // per request
    location: 60000,       // includes the time someone takes to answer a permission prompt
    telegramSilent: 10000, // iOS never answers when Telegram itself lacks location permission
    grace: 5000,           // how long a late Telegram answer may still win after that
    browserLocation: 20000,
    slowHint: 8000,
  };
  var PHONE_PLATFORMS = ['android', 'ios'];
  var APPROXIMATE_M = 1000; // accuracy this coarse means the phone shares an approximate location

  var tg = window.Telegram && window.Telegram.WebApp;
  var appEl = document.getElementById('app');
  var statusEl = document.getElementById('status');
  var screenEl = document.getElementById('screen');
  var actionsEl = document.getElementById('actions');
  var status = null;       // last `status` payload
  var working = false;     // a start or check-in is in flight
  var confirming = false;  // the Start confirmation is showing
  var current = '';        // name of the view on screen
  var renders = 0;
  var denials = 0;         // location refusals in a row
  var settingsOpened = false;

  // ---------- views ----------

  function sessionMeta() {
    var s = status && status.activeSession;
    if (!s) return '';
    return 'Open until ' + s.closesAtText + (status.isAdmin && s.startedByName ? ' · started by ' + s.startedByName : '');
  }

  function metres(m) {
    return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';
  }

  var NOT_CHECKED_IN = 'Not checked in';

  var views = {
    outside: function () {
      return { state: 'outside', icon: 'send', title: 'Open this from Telegram',
        line: 'Tap the 📍 Check in button in your group chat.' };
    },
    sdkFailed: function () {
      return { state: 'sdk-failed', icon: 'alert', tone: 'bad', title: 'Couldn’t load check-in',
        line: 'Check your connection, then reload.',
        actions: [{ label: 'Reload', primary: true, onClick: function () { location.reload(); } }] };
    },
    desktop: function () {
      return { state: 'desktop', icon: 'phone', title: 'Open this on your phone',
        line: 'Check-in uses your phone’s location, so it only works in the Telegram app for Android or iPhone.' };
    },
    notConnected: function () {
      return { state: 'not-connected', icon: 'alert', tone: 'bad', title: 'Not connected yet',
        line: 'The bot owner still needs to set API_URL in web/index.html.' };
    },
    loading: function (title, hint, slowHint) {
      return { state: 'loading', spinner: true, title: title, hint: hint, slowHint: slowHint, meta: sessionMeta() };
    },
    noSession: function () {
      return { state: 'no-session', icon: 'clock', title: 'No check-in open right now',
        line: 'When an admin opens one, tap the 📍 Check in button in the group.' };
    },
    closed: function () {
      return { state: 'closed', icon: 'x', tone: 'no', outcome: NOT_CHECKED_IN, title: 'Check-in closed before you got in',
        line: 'This check-in has closed. If you were there, ask an admin.',
        actions: [{ label: 'Done', onClick: closeApp }] };
    },
    adminIdle: function () {
      var mins = (status && status.sessionMinutes) || 60;
      return { state: 'admin-idle', icon: 'flag', title: 'No check-in open',
        line: 'Start one and the group can check in for the next ' + mins + ' minutes.',
        hint: 'Once started, a check-in can’t be ended early.',
        actions: [{ label: 'Start check-in (' + mins + ' min)', primary: true, onClick: startSession }] };
    },
    adminStarted: function (data) {
      // Admins are not checked in automatically, so their own status must not read as done.
      var actions = [{ label: 'Check in', primary: true, onClick: checkIn }];
      if (data.warning && data.shareLink) actions.push({ label: 'Share check-in link', onClick: function () { share(data.shareLink); } });
      return { state: 'admin-started', icon: 'flag', tone: 'good', title: 'Check-in started',
        line: 'You’re not checked in yet. Tap Check in when you’re at the venue.',
        meta: 'Open until ' + data.closesAtText, notice: data.warning, actions: actions };
    },
    ready: function (line) {
      return { state: 'ready', icon: 'pin', title: 'Check-in is open',
        line: line || 'Tap Check in when you’re at the venue.', meta: sessionMeta(),
        actions: [{ label: 'Check in', primary: true, onClick: checkIn }] };
    },
    checkedIn: function (atText, closesAtText, isNew) {
      var s = status && status.activeSession;
      return { state: 'checked-in', stamp: atText, stampIsNew: isNew, title: 'You’re on the list',
        line: 'Check-in closes at ' + closesAtText + '.',
        meta: status && status.isAdmin && s && s.startedByName ? 'Started by ' + s.startedByName : '',
        actions: [{ label: 'Done', onClick: closeApp }] };
    },
    failed: function (res, retry, duringCheckIn) {
      var titles = {
        OUT_OF_RANGE: 'You’re too far from the venue',
        LOW_ACCURACY: 'Your location isn’t precise enough',
        NOT_MEMBER: 'Members only',
        BUSY: 'Busy right now',
        NETWORK: 'Couldn’t reach the server',
      };
      var line = res.message;
      var d = res.data || {};
      if (res.code === 'LOW_ACCURACY' && d.accuracyM > APPROXIMATE_M) {
        line = 'Your phone is sharing an approximate location (±' + metres(d.accuracyM) +
          '). Turn on Precise Location for Telegram in your phone’s settings, then try again.';
      }
      if (res.code === 'OUT_OF_RANGE' && d.distanceM >= 1000) {
        line = 'You’re ' + metres(d.distanceM) + ' from the venue. Check-in works within ' + d.radiusM + ' m.';
      }
      var outcome = '';
      if (duringCheckIn) {
        // After a network failure the server may still have recorded it, so don't claim a "no".
        if (res.code === 'NETWORK') {
          outcome = 'Not confirmed';
          line = 'We couldn’t confirm your check-in. Try again — you won’t be counted twice.';
        } else {
          outcome = NOT_CHECKED_IN;
        }
      }
      return { state: 'failed', icon: duringCheckIn ? 'x' : 'alert', tone: duringCheckIn ? 'no' : 'bad', outcome: outcome,
        title: titles[res.code] || 'Something went wrong', line: line, meta: sessionMeta(),
        actions: [{ label: 'Try again', primary: true, onClick: retry }] };
    },
    auth: function (res, duringCheckIn) {
      return { state: 'auth', icon: duringCheckIn ? 'x' : 'lock', tone: duringCheckIn ? 'no' : 'bad',
        outcome: duringCheckIn ? NOT_CHECKED_IN : '',
        title: res.code === 'AUTH_EXPIRED' ? 'This page timed out' : 'Couldn’t verify you',
        line: res.message, actions: [{ label: 'Close', primary: true, onClick: closeApp }] };
    },
    // where: 'bot' = this bot's location permission in Telegram (can open its settings);
    //        'app' = Telegram's own location permission in the phone's settings.
    locationDenied: function (where) {
      var bot = where === 'bot';
      var still = denials > 1 ? 'still ' : '';
      var settings = { label: 'Open settings', primary: !settingsOpened, onClick: openLocationSettings };
      var retry = { label: 'Try again', primary: !bot || settingsOpened, onClick: checkIn };
      return { state: 'location-denied', icon: 'x', tone: 'no', outcome: NOT_CHECKED_IN, shake: denials > 1,
        title: bot ? 'Location access is ' + still + 'off' : 'Location is ' + still + 'off for Telegram',
        line: bot
          ? 'Allow location for this check-in in Telegram’s settings, then come back and tap Try again.'
          : 'Allow location for Telegram in your phone’s settings, then try again.',
        meta: sessionMeta(),
        actions: bot ? (settingsOpened ? [retry, settings] : [settings, retry]) : [retry] };
    },
    locationError: function (kind) {
      return { state: 'location-error', icon: 'x', tone: 'no', outcome: NOT_CHECKED_IN,
        title: 'Couldn’t get your location',
        line: kind === 'timeout'
          ? 'Your phone didn’t return a location in time. Check that Location is on and Telegram may use it, then try again.'
          : 'Turn on Location on your phone, then try again.',
        meta: sessionMeta(), actions: [{ label: 'Try again', primary: true, onClick: checkIn }] };
    },
  };

  // ---------- flows ----------

  function start() {
    fitTheme();
    if (!tg) {
      // Opened by Telegram (launch data in the URL) but its script failed to load, e.g. on flaky Wi-Fi.
      return render(/tgWebAppData=/.test(location.hash) ? views.sdkFailed() : views.outside());
    }
    if (!tg.initData) return render(views.outside());
    tg.ready();
    tg.expand();
    // iOS WebKit only shows :active on touch when a touchstart listener exists.
    document.addEventListener('touchstart', function () {}, { passive: true });
    if (tg.onEvent) {
      tg.onEvent('themeChanged', fitTheme);
      // Android reports a permission change. iOS may report nothing, so there Try again becomes the
      // primary button after Open settings; if the client does report activation, retry once.
      tg.onEvent('locationManagerUpdated', function () {
        var lm = tg.LocationManager;
        if (current === 'location-denied' && lm && lm.isAccessGranted) checkIn();
      });
      tg.onEvent('activated', function () {
        if (current === 'location-denied' && settingsOpened) checkIn();
      });
    }
    if (PHONE_PLATFORMS.indexOf(tg.platform) === -1) return render(views.desktop());
    if (API_URL.indexOf('PASTE_') !== -1) return render(views.notConnected());
    loadStatus(true);
  }

  function loadStatus(autoCheckIn, readyLine) {
    render(views.loading('Checking…'));
    return api('status').then(function (res) {
      if (!res.ok) return fail(res, function () { loadStatus(autoCheckIn, readyLine); }, false);
      status = res.data;
      var s = status.activeSession;
      if (!s) return render(status.isAdmin ? views.adminIdle() : views.noSession());
      if (status.myCheckin) return render(views.checkedIn(status.myCheckin.atText, s.closesAtText, false));
      // The group tap should be the only tap: try straight away.
      if (autoCheckIn) return checkIn();
      render(views.ready(readyLine));
    });
  }

  function startSession() {
    if (working || confirming) return; // a double tap must not stack a second confirmation
    confirming = true;
    var mins = (status && status.sessionMinutes) || 60;
    confirmDialog('Start a ' + mins + '-minute check-in for the group? It can’t be ended early.').then(function (ok) {
      confirming = false;
      if (!ok || working) return;
      working = true;
      render(views.loading('Starting check-in…'));
      api('startSession').then(function (res) {
        working = false;
        if (res.code === 'SESSION_STARTED') {
          haptic('success');
          status.activeSession = res.data;
          // data.warning (Phase 3) explains e.g. that the group announcement could not be sent.
          return render(views.adminStarted(res.data));
        }
        if (res.code === 'SESSION_ACTIVE') {
          // Another admin got there first: say so, and that this admin is not checked in yet.
          var by = (res.data && res.data.startedByName) || 'Another admin';
          return loadStatus(false, by + ' already started this check-in. You’re not checked in yet.');
        }
        fail(res, startSession, false);
      });
    });
  }

  function checkIn() {
    if (working) return;
    working = true;
    render(views.loading('Getting your location…', 'If Telegram asks, allow location access.',
      'Still looking for your location. Check that Location is on.'));
    getLocation().then(function (fix) {
      denials = 0;
      return submit(fix, false);
    }, function (err) {
      working = false;
      haptic('error');
      if (err.kind === 'denied') {
        denials++;
        return render(views.locationDenied(err.where));
      }
      render(views.locationError(err.kind));
    });
  }

  function submit(fix, isFreshRetry) {
    render(views.loading('Checking you in…'));
    return api('checkin', { location: { lat: fix.lat, lng: fix.lng, accuracy: fix.accuracy } }).then(function (res) {
      if (res.code === 'CHECKED_IN' || res.code === 'ALREADY_CHECKED_IN') {
        working = false;
        haptic('success');
        status.myCheckin = { at: res.data.at, atText: res.data.atText };
        return render(views.checkedIn(res.data.atText, res.data.closesAtText, true));
      }
      // Telegram for Android answers with the phone's cached last-known fix, which can be stale. If it
      // lands too far away or too rough, get one fresh fix before saying no. (Only here, because the
      // fresh fix costs a Telegram permission prompt on Android.)
      if (fix.source === 'telegram' && tg.platform === 'android' && !isFreshRetry &&
          (res.code === 'OUT_OF_RANGE' || res.code === 'LOW_ACCURACY')) {
        render(views.loading('Getting a fresh location…', 'If Telegram asks, allow location access.'));
        return browserLocation().then(function (fresh) { return submit(fresh, true); }, function () {
          working = false;
          fail(res, checkIn, true);
        });
      }
      working = false;
      if (res.code === 'NO_ACTIVE_SESSION') {
        haptic('error');
        return render(views.closed());
      }
      fail(res, checkIn, true);
    });
  }

  function fail(res, retry, duringCheckIn) {
    haptic('error');
    if (res.code === 'AUTH_FAILED' || res.code === 'AUTH_EXPIRED') return render(views.auth(res, duringCheckIn));
    if (res.code === 'UNSUPPORTED_PLATFORM') return render(views.desktop());
    render(views.failed(res, retry, duringCheckIn));
  }

  // ---------- backend ----------

  // text/plain keeps this a CORS "simple request" (no preflight, which Apps Script can't answer).
  function api(action, extra, isRetry) {
    var body = { action: action, initData: tg.initData, platform: tg.platform };
    if (extra) for (var k in extra) body[k] = extra[k];
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMING.request) : null;
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined,
    })
      .then(function (r) { return r.json(); })
      .catch(function () { return null; })
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res || typeof res.code !== 'string') {
          // Offline, timed out, or Apps Script answered with an HTML error page (e.g. overloaded).
          res = { ok: false, code: 'NETWORK', message: 'Check your connection and try again.' };
        }
        if ((res.code === 'BUSY' || res.code === 'NETWORK') && !isRetry) {
          if (current === 'loading') setTitle('Trying again…');
          return sleep(TIMING.retryAfter).then(function () { return api(action, extra, true); });
        }
        return res;
      });
  }

  // ---------- location (device GPS only; never a map or manual input) ----------

  function getLocation() {
    var lm = tg.LocationManager;
    if (!lm || !tg.isVersionAtLeast || !tg.isVersionAtLeast('8.0')) return browserLocation();
    return telegramLocation(lm);
  }

  function telegramLocation(lm) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timers = [];
      timers.push(setTimeout(function () { finish(reject, { kind: 'timeout' }); }, TIMING.location));
      function finish(fn, value) {
        if (settled) return;
        settled = true;
        timers.forEach(clearTimeout);
        fn(value);
      }
      function request() {
        try {
          if (!lm.isLocationAvailable) {
            return browserLocation().then(function (v) { finish(resolve, v); }, function (e) { finish(reject, e); });
          }
          // iOS sends no answer at all when Telegram lacks the phone's location permission. Once this
          // bot has asked before (so no first-run sheet is being read), ask the browser API, which
          // fails at once in that case; a late Telegram answer still wins during a short grace period.
          if (tg.platform === 'ios' && lm.isAccessRequested) {
            timers.push(setTimeout(function () {
              browserLocation().then(function (fix) { finish(resolve, fix); }, function (e) {
                if (e.kind !== 'denied') return;
                timers.push(setTimeout(function () { finish(reject, { kind: 'denied', where: 'app' }); }, TIMING.grace));
              });
            }, TIMING.telegramSilent));
          }
          lm.getLocation(function (data) {
            if (!data) {
              // null: either this bot's permission was refused, or it is granted but the phone can't
              // give a location (e.g. Location switched off), where settings would not help.
              return finish(reject, lm.isAccessGranted ? { kind: 'unavailable' } : { kind: 'denied', where: 'bot' });
            }
            var fix = { lat: data.latitude, lng: data.longitude, accuracy: data.horizontal_accuracy, source: 'telegram' };
            if (typeof fix.accuracy === 'number') return finish(resolve, fix);
            // Telegram gave no accuracy; the browser's fix always has one.
            browserLocation().then(function (v) { finish(resolve, v); }, function () { finish(resolve, fix); });
          });
        } catch (e) {
          finish(reject, { kind: 'unavailable' });
        }
      }
      try {
        if (lm.isInited) request(); else lm.init(request);
      } catch (e) {
        finish(reject, { kind: 'unavailable' });
      }
    });
  }

  function browserLocation() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) return reject({ kind: 'unavailable' });
      var settled = false;
      var guard = setTimeout(function () { done(reject, { kind: 'timeout' }); }, TIMING.browserLocation);
      function done(fn, v) { if (!settled) { settled = true; clearTimeout(guard); fn(v); } }
      navigator.geolocation.getCurrentPosition(function (p) {
        done(resolve, { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy, source: 'browser' });
      }, function (e) {
        done(reject, e.code === 1 ? { kind: 'denied', where: 'app' } : { kind: e.code === 3 ? 'timeout' : 'unavailable' });
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    });
  }

  function openLocationSettings() {
    var lm = tg.LocationManager;
    settingsOpened = true;
    try {
      // The SDK only opens settings when access was asked for and refused; otherwise just retry.
      if (!lm || !lm.isAccessRequested || lm.isAccessGranted) return checkIn();
      lm.openSettings();
    } catch (e) {
      return render(views.locationDenied('app'));
    }
    render(views.locationDenied('bot'));
  }

  // ---------- Telegram helpers ----------

  function confirmDialog(message) {
    return new Promise(function (resolve) {
      if (!tg.isVersionAtLeast || !tg.isVersionAtLeast('6.2')) return resolve(window.confirm(message));
      try {
        tg.showConfirm(message, function (ok) { resolve(!!ok); });
      } catch (e) {
        resolve(false); // e.g. a popup is already open: never stack a second dialog
      }
    });
  }

  function share(link) {
    var url = 'https://t.me/share/url?url=' + encodeURIComponent(link);
    try { tg.openTelegramLink(url); } catch (e) { window.open(url, '_blank'); }
  }

  function haptic(type) {
    try { tg.HapticFeedback.notificationOccurred(type); } catch (e) { /* unsupported client */ }
  }

  function closeApp() {
    try { tg.close(); } catch (e) { /* nothing to close */ }
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // ---------- rendering (textContent only: names come from users) ----------

  var ICONS = {
    phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    send: '<path d="M21 3 3 10.5l7 2.5 2.5 7z"/><path d="M10 13 21 3"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    flag: '<path d="M6.5 21V4h11l-2 4 2 4h-11"/>',
    pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.5h.01"/>',
    x: '<path d="M7 7l10 10"/><path d="M17 7 7 17"/>',
  };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function markEl(view) {
    var mark = el('div', 'mark' + (view.shake ? ' shake' : ''));
    if (view.tone) mark.setAttribute('data-tone', view.tone);
    if (view.spinner) {
      var spinner = el('div', 'spinner');
      spinner.setAttribute('aria-hidden', 'true');
      mark.appendChild(spinner);
    } else {
      mark.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[view.icon] + '</svg>';
    }
    return mark;
  }

  function stampEl(atText, isNew) {
    var stamp = el('div', 'stamp' + (isNew ? ' is-new' : ''));
    stamp.setAttribute('aria-hidden', 'true'); // announced through the title
    stamp.appendChild(el('span', 'stamp-label', 'Checked in'));
    stamp.appendChild(el('span', 'stamp-time', atText));
    return stamp;
  }

  function noticeEl(text) {
    var p = el('p', 'notice');
    p.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS.alert + '</svg>';
    p.appendChild(el('span', '', text));
    return p;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function setTitle(text) {
    var h = screenEl.querySelector('.title');
    if (h) h.lastChild.textContent = text;
  }

  function render(view) {
    // Keep keyboard and screen-reader users in place: if focus was in the app, move it to the new screen.
    var hadFocus = document.activeElement && document.activeElement !== document.body && appEl.contains(document.activeElement);
    var id = ++renders;
    current = view.state;
    document.body.setAttribute('data-state', view.state);
    clear(screenEl);
    screenEl.appendChild(view.stamp ? stampEl(view.stamp, view.stampIsNew) : markEl(view));
    if (view.outcome) {
      var outcome = el('p', 'outcome', view.outcome);
      outcome.setAttribute('aria-hidden', 'true'); // announced through the title
      screenEl.appendChild(outcome);
    }
    // The title carries the answer for screen readers, so focus on it reads "Not checked in: …".
    var answer = view.stamp ? 'Checked in at ' + view.stamp + '. ' : view.outcome ? view.outcome + ': ' : '';
    var title = el('h1', 'title');
    if (answer) title.appendChild(el('span', 'visually-hidden', answer));
    title.appendChild(document.createTextNode(view.title));
    title.tabIndex = -1;
    screenEl.appendChild(title);
    if (view.line) screenEl.appendChild(el('p', 'line', view.line));
    if (view.meta) screenEl.appendChild(el('p', 'meta', view.meta));
    if (view.notice) screenEl.appendChild(noticeEl(view.notice));
    if (view.hint) screenEl.appendChild(el('p', 'hint', view.hint));
    clear(actionsEl);
    var primary = null;
    (view.actions || []).forEach(function (a) {
      var b = el('button', 'btn ' + (a.primary ? 'btn-primary' : 'btn-secondary'), a.label);
      b.type = 'button';
      b.addEventListener('click', a.onClick);
      actionsEl.appendChild(b);
      if (a.primary && !primary) primary = b;
    });
    // One sentence for screen readers, instead of re-reading the whole screen on every change.
    statusEl.textContent = answer + view.title + (view.line ? '. ' + view.line : '');
    if (hadFocus) (primary || title).focus();
    if (view.state === 'loading') {
      // Slow venue Wi-Fi, a slow GPS fix or an Apps Script cold start: say it is still working.
      setTimeout(function () {
        if (renders !== id) return;
        screenEl.appendChild(el('p', 'hint', view.slowHint || 'Still working. A slow connection can take a little while.'));
      }, TIMING.slowHint);
    }
  }

  // ---------- colours: keep the user's theme, but never below WCAG AA ----------

  function fitTheme() {
    var root = document.documentElement;
    ['--c-surface', '--c-muted', '--c-accent-ink', '--c-accent-text', '--c-button', '--c-link-ink', '--c-danger-ink'].forEach(function (p) {
      root.style.removeProperty(p);
    });
    var probe = document.createElement('span');
    probe.style.display = 'none';
    document.body.appendChild(probe);
    function read(token) {
      probe.style.color = 'var(' + token + ')';
      var m = getComputedStyle(probe).color.match(/[\d.]+/g) || ['0', '0', '0'];
      return [Number(m[0]), Number(m[1]), Number(m[2])];
    }
    function set(prop, rgb) { root.style.setProperty(prop, 'rgb(' + rgb.join(',') + ')'); }
    var bg = read('--bg');
    var text = read('--text');
    var surface = read('--surface');
    // Dark themes (Telegram's own) often make secondary surfaces darker than the page, so buttons and
    // discs sink out of sight. Lift them slightly toward the text colour instead.
    if (luminance(bg) < 0.2 && (luminance(surface) <= luminance(bg) || contrast(surface, bg) < 1.15)) {
      surface = bg.map(function (v, i) { return Math.round(v + (text[i] - v) * 0.1); });
      set('--c-surface', surface);
    }
    var accent = read('--accent');
    set('--c-muted', readable(read('--hint'), [bg, surface], 4.5));
    set('--c-accent-ink', readable(accent, [bg, surface], 3));
    set('--c-accent-text', readable(accent, [bg], 4.5));
    set('--c-link-ink', readable(read('--link'), [surface], 3)); // secondary button labels are large text
    set('--c-danger-ink', readable(read('--danger'), [bg, surface], 4.5));
    set('--c-button', readable(accent, [read('--accent-fg')], 3)); // its label is large bold text
    probe.remove();
  }

  // Changes only the lightness (OKLCH) of `color` until it reaches `min` contrast against every
  // background, so the theme's hue survives; chroma is reduced only as far as sRGB requires.
  function readable(color, backgrounds, min) {
    function ok(c) { return backgrounds.every(function (b) { return contrast(c, b) >= min; }); }
    if (ok(color)) return color;
    var lab = toOklab(color);
    var chroma = Math.sqrt(lab[1] * lab[1] + lab[2] * lab[2]);
    var hue = Math.atan2(lab[2], lab[1]);
    var dir = luminance(backgrounds[0]) > 0.18 ? -1 : 1; // darken on light backgrounds, lighten on dark
    for (var L = lab[0] + dir * 0.01; L > 0 && L < 1; L += dir * 0.01) {
      var c = fromOklch(L, chroma, hue);
      if (ok(c)) return c;
    }
    return dir < 0 ? [0, 0, 0] : [255, 255, 255];
  }

  function toLinear(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function toByte(v) { return Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055)); }

  function toOklab(rgb) {
    var r = toLinear(rgb[0]), g = toLinear(rgb[1]), b = toLinear(rgb[2]);
    var l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    var m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    var s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
  }

  function oklabToLinear(L, a, b) {
    var l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
    var m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
    var s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
    return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
  }

  function fromOklch(L, chroma, hue) {
    for (var c = chroma; c >= 0; c -= 0.005) {
      var lin = oklabToLinear(L, c * Math.cos(hue), c * Math.sin(hue));
      if (lin.every(function (v) { return v >= -0.0005 && v <= 1.0005; })) {
        return lin.map(function (v) { return toByte(Math.min(1, Math.max(0, v))); });
      }
    }
    return oklabToLinear(L, 0, 0).map(function (v) { return toByte(Math.min(1, Math.max(0, v))); });
  }

  function luminance(rgb) {
    var c = rgb.map(function (v) {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }

  function contrast(a, b) {
    var la = luminance(a);
    var lb = luminance(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }

  start();
})();
</script>
</body>
