<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini App gallery</title>
<style>
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: #e7e9ee; color: #16181d; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; }
  nav a { margin-right: 8px; color: #1f5f99; }
  nav a[aria-current] { font-weight: 700; color: #16181d; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 6px; font-weight: 600; }
  iframe { display: block; width: 375px; height: 740px; border: 0; border-radius: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.12); background: #fff; }
</style>
<header>
  <h1>Check-in Mini App: every state at 375px</h1>
  <nav id="themes"></nav>
</header>
<div class="grid" id="grid"></div>
<!-- Dev-only preview of web/index.html. Each frame is the real page with scripted Telegram/backend mocks. -->
<script src="scenarios.js"></script>
<script>
  // [scenario, caption]. Each frame replays the scenario's own steps (clicks, taps, typing).
  var SHOW = [
    ['profile-picker', 'After check-in: group + name (first time)'],
    ['profile-first-time', 'Group saved'],
    ['profile-change-open', 'Change group or name'],
    ['profile-group-removed', 'Group no longer listed (name kept)'],
    ['profile-no-groups', 'No groups defined: name only'],
    ['profile-name-untouched', 'Rank and name left empty'],
    ['profile-save-network-error', 'Couldn’t save (still checked in)'],
    ['profile-many-long-groups', 'Admin, 12 groups, long names'],
    ['admin-idle', 'Admin, no session'],
    ['admin-settings-open', 'Admin: check-in settings'],
    ['admin-settings-out-of-range', 'Settings: values out of range'],
    ['admin-settings-save', 'Settings saved'],
    ['admin-settings-during-session', 'Settings while a check-in is open'],
    ['admin-checked-in-settings', 'Admin checked in: settings saved'],
    ['admin-settings-network', 'Settings: couldn’t save'],
    ['admin-low-accuracy-settings', 'Admin: accuracy raised from a failure'],
    ['admin-out-of-range-settings-cancel', 'Admin too far: settings offered'],
    ['admin-settings-minutes-during-session', 'Minutes changed during a check-in'],
    ['admin-settings-saving-slow', 'Saving while a crowd checks in'],
    ['admin-settings-busy', 'Save gave up: busy'],
    ['admin-start-warning', 'Admin just started (with warning)'],
    ['admin-out-of-range-buttons', 'Admin too far: move the point'],
    ['admin-no-site', 'Admin: session without a point'],
    ['admin-start-location-denied', 'Admin start: location off'],
    ['member-auto-checkin', 'Checked in (returning, no groups)'],
    ['member-no-session', 'Member, no session'],
    ['out-of-range', 'Member too far away'],
    ['member-no-site', 'Member: session without a point'],
    ['outside-telegram', 'Opened outside Telegram'],
  ];
  var theme = new URLSearchParams(location.search).get('theme') || 'light';
  // ?size=360x660 previews a real phone's Mini App viewport (default 375x740).
  var size = /^(\d+)x(\d+)$/.exec(new URLSearchParams(location.search).get('size') || '');
  var only = new URLSearchParams(location.search).get('only');
  if (only) SHOW = SHOW.filter(function (s) { return only.split(',').indexOf(s[0]) !== -1; });
  var nav = document.getElementById('themes');
  Object.keys(THEMES).forEach(function (t) {
    var a = document.createElement('a');
    a.href = '?theme=' + t;
    a.textContent = t;
    if (t === theme) a.setAttribute('aria-current', 'page');
    nav.appendChild(a);
  });
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function until(fn, ms) {
    var end = Date.now() + ms;
    while (Date.now() < end) { try { if (fn()) return true; } catch (e) {} await wait(80); }
    return false;
  }
  async function replay(frame, sc) {
    var doc = function () { return frame.contentDocument; };
    var state = function () { return doc().body && doc().body.getAttribute('data-state'); };
    var find = function (label, scope) {
      var all = Array.prototype.slice.call(doc().querySelectorAll(scope));
      return all.find(function (b) { return b.textContent === label; }) || all.find(function (b) { return b.textContent.indexOf(label) !== -1; });
    };
    for (var i = 0; i < (sc.steps || []).length; i++) {
      var step = sc.steps[i];
      if (step.waitState) await until(function () { return state() === step.waitState; }, 8000);
      if (step.fill) {
        var f = doc().querySelector(step.fill[0]);
        if (f) { f.value = step.fill[1]; f.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true })); }
      }
      var label = step.click || step.tap;
      if (label) {
        var scope = step.click ? '#actions button' : '#app button';
        await until(function () { return find(label, scope) && state() !== 'loading'; }, 8000);
        var b = find(label, scope);
        if (b) b.click();
        await wait(60);
      }
    }
    await until(function () { return state() === sc.expect.state; }, 8000);
    var still = doc().createElement('style'); // a hidden pane pauses animations; show the resting state
    still.textContent = '*, *::before, *::after { animation: none !important; transition: none !important; }';
    doc().head.appendChild(still);
    frame.setAttribute('data-ready', '1');
  }
  var grid = document.getElementById('grid');
  SHOW.forEach(function (s) {
    var fig = document.createElement('figure');
    var cap = document.createElement('figcaption');
    cap.textContent = s[1];
    var frame = document.createElement('iframe');
    frame.title = s[1];
    frame.src = 'harness.html?scenario=' + s[0] + '&theme=' + theme;
    if (size) { frame.style.width = size[1] + 'px'; frame.style.height = size[2] + 'px'; }
    fig.appendChild(cap);
    fig.appendChild(frame);
    grid.appendChild(fig);
    frame.addEventListener('load', function () { replay(frame, SCENARIOS[s[0]]); }, { once: true });
  });
</script>
