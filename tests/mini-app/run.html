<!doctype html>
<meta charset="utf-8">
<title>Mini App scenarios</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
  .pass { color: #1b7f3b; } .fail { color: #b3261e; font-weight: 600; }
  iframe { width: 390px; height: 700px; border: 1px solid #ccc; position: absolute; left: -10000px; }
  td { padding: 2px 8px; vertical-align: top; }
</style>
<h1>Mini App scenarios</h1>
<p id="summary">Running…</p>
<table id="results"></table>
<!-- Runs every scenario in scenarios.js against the real web/index.html and checks the result.
     Serve the repo root and open /tests/mini-app/run.html; window.__results holds the outcome. -->
<script src="scenarios.js"></script>
<script>
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function until(fn, ms) {
    var end = Date.now() + ms;
    while (Date.now() < end) {
      try { if (fn()) return true; } catch (e) { /* frame not ready */ }
      await wait(50);
    }
    return false;
  }

  function findButton(doc, label) {
    var all = Array.prototype.slice.call(doc.querySelectorAll('#app button'));
    return all.find(function (b) { return b.textContent === label; }) ||
      all.find(function (b) { return b.textContent.indexOf(label) !== -1; });
  }

  function choices(doc) {
    return Array.prototype.map.call(doc.querySelectorAll('.choice'), function (b) { return b.textContent; });
  }

  function buttons(doc) {
    return Array.prototype.map.call(doc.querySelectorAll('#actions button'), function (b) { return b.textContent; });
  }

  async function run(name) {
    var sc = SCENARIOS[name];
    var errors = [];
    var frame = document.createElement('iframe');
    frame.src = 'harness.html?scenario=' + encodeURIComponent(name);
    if (sc.frame) { frame.style.width = sc.frame[0] + 'px'; frame.style.height = sc.frame[1] + 'px'; } // a phone size: [width, height]
    document.body.appendChild(frame);
    var doc = function () { return frame.contentDocument; };
    var win = function () { return frame.contentWindow; };
    var state = function () { return doc().body && doc().body.getAttribute('data-state'); };
    var text = function () { return doc().getElementById('screen').textContent; };
    // notText also covers what a screen reader hears (the live region) and the action bar's labels.
    var heard = function () { return text() + ' ' + doc().getElementById('status').textContent + ' ' + buttons(doc()).join(' '); };
    var titleText = function () {
      var t = doc().querySelector('#screen .title');
      if (!t) return null;
      var copy = t.cloneNode(true);
      Array.prototype.forEach.call(copy.querySelectorAll('.visually-hidden'), function (n) { n.remove(); });
      return copy.textContent;
    };
    var lineText = function () { var l = doc().querySelector('#screen .line'); return l ? l.textContent : null; };

    for (var i = 0; i < (sc.steps || []).length; i++) {
      var step = sc.steps[i];
      if (step.waitState && !(await until(function () { return state() === step.waitState; }, 8000))) {
        errors.push('never reached ' + step.waitState + ' (at ' + state() + ')');
        break;
      }
      (step.text || []).forEach(function (t) { if (text().indexOf(t) === -1) errors.push('step text missing: ' + t); });
      (step.notText || []).forEach(function (t) { if (heard().indexOf(t) !== -1) errors.push('step unexpected text: ' + t); });
      if (step.waitText && !(await until(function () { return step.waitText.every(function (t) { return text().indexOf(t) !== -1; }); }, 8000))) {
        errors.push('never showed ' + JSON.stringify(step.waitText) + ' (at ' + state() + ')');
        break;
      }
      if (step.pause) await wait(step.pause);
      if (step.back) { win().__pressBack(); await wait(30); }
      if (step.quickClicks) {
        // A double tap: the second tap lands on whatever button now sits under the finger.
        var first = await until(function () { return buttons(doc()).indexOf(step.quickClicks[0]) !== -1 && state() !== 'loading'; }, 8000);
        if (!first) { errors.push('no button ' + step.quickClicks[0] + ' (at ' + state() + ')'); break; }
        step.quickClicks.forEach(function (lbl) {
          var q = Array.prototype.find.call(doc().querySelectorAll('#actions button'), function (b) { return b.textContent === lbl; });
          if (q) q.click();
        });
        await wait(30);
      }
      if (step.fill) {
        var field = doc().querySelector(step.fill[0]);
        if (!field) { errors.push('no field ' + step.fill[0] + ' (at ' + state() + ')'); break; }
        field.value = step.fill[1];
        var W = win();
        field.dispatchEvent(new W.Event('input', { bubbles: true }));
      }
      if (step.tap) {
        // Any button in the app (group buttons and the profile pill live outside #actions).
        var found = await until(function () { return findButton(doc(), step.tap) && state() !== 'loading'; }, 8000);
        if (!found) { errors.push('no button ' + step.tap + ' (at ' + state() + ')'); break; }
        var target = findButton(doc(), step.tap);
        target.focus();
        target.click();
        await wait(30);
      }
      var label = step.click || step.doubleClick;
      if (label) {
        var ok = await until(function () {
          return buttons(doc()).indexOf(label) !== -1 && state() !== 'loading';
        }, 8000);
        if (!ok) { errors.push('no button ' + label + ' (at ' + state() + ')'); break; }
        var btn = Array.prototype.find.call(doc().querySelectorAll('#actions button'), function (b) { return b.textContent === label; });
        btn.focus();
        btn.click();
        if (step.doubleClick) btn.click();
        await wait(30);
      }
    }

    var e = sc.expect;
    // Scenarios that wait out retries can ask for longer (a hidden pane also slows timers).
    if (!errors.length && !(await until(function () { return state() === e.state; }, e.waitMs || 8000))) {
      errors.push('state ' + state() + ', expected ' + e.state);
    }
    await wait(150); // let any extra requests show up
    await until(function () { return (e.text || []).every(function (t) { return text().indexOf(t) !== -1; }); }, e.waitMs || 3000);
    if (!errors.length) {
      var log = win().__mini;
      (e.text || []).forEach(function (t) { if (text().indexOf(t) === -1) errors.push('text missing: ' + t); });
      (e.notText || []).forEach(function (t) { if (heard().indexOf(t) !== -1) errors.push('unexpected text: ' + t); });
      if (e.title !== undefined && titleText() !== e.title) errors.push('title ' + JSON.stringify(titleText()));
      if (e.line !== undefined && lineText() !== e.line) errors.push('line ' + JSON.stringify(lineText()));
      if (e.buttons && JSON.stringify(buttons(doc())) !== JSON.stringify(e.buttons)) errors.push('buttons ' + JSON.stringify(buttons(doc())));
      (e.notButtons || []).forEach(function (b) { if (buttons(doc()).indexOf(b) !== -1) errors.push('unexpected button ' + b); });
      if (e.calls) {
        var actions = log.calls.map(function (c) { return c.action; });
        if (JSON.stringify(actions) !== JSON.stringify(e.calls)) errors.push('calls ' + JSON.stringify(actions));
      }
      log.calls.forEach(function (c) {
        if (typeof c.initData !== 'string' || !c.initData) errors.push('request without initData');
        if (c.platform !== (sc.platform || 'android')) errors.push('request platform ' + c.platform);
      });
      if (e.sentLocations) {
        var all = log.calls.filter(function (c) { return c.action === 'checkin'; }).map(function (c) { return c.location; });
        if (JSON.stringify(all) !== JSON.stringify(e.sentLocations)) errors.push('sent locations ' + JSON.stringify(all));
      }
      if (e.nativeConfirms !== undefined && log.nativeConfirms !== e.nativeConfirms) errors.push('native confirm x' + log.nativeConfirms);
      if (e.openedLinks && JSON.stringify(log.openedLinks) !== JSON.stringify(e.openedLinks)) errors.push('links ' + JSON.stringify(log.openedLinks));
      if (e.stampFits) {
        var st = doc().querySelector('.stamp'), tm = doc().querySelector('.stamp-time'), lb = doc().querySelector('.stamp-label');
        var cs = function (n) { return win().getComputedStyle(n); };
        // Layout size, not the on-screen box: the stamp's press-in animation scales it.
        if (tm.offsetHeight > parseFloat(cs(tm).fontSize) * 1.5) errors.push('stamp time wraps');
        // Every corner of the label and the time must sit inside the inner ring (inset 8px, 1px line).
        var c = st.clientWidth / 2, r = c - 9;
        [lb, tm].forEach(function (n) {
          var half = parseFloat(cs(n).fontSize) * 0.375; // glyph height, not the line box
          var mid = n.offsetTop + n.offsetHeight / 2;
          [[n.offsetLeft, mid - half], [n.offsetLeft + n.offsetWidth, mid - half],
            [n.offsetLeft, mid + half], [n.offsetLeft + n.offsetWidth, mid + half]].forEach(function (pt) {
            if (Math.hypot(pt[0] - c, pt[1] - c) > r) errors.push((n === lb ? 'label' : 'time') + ' crosses the ring');
          });
        });
      }
      if (e.sentLocation) {
        var sent = log.calls.filter(function (c) { return c.action === 'checkin'; }).map(function (c) { return c.location; })[0];
        if (JSON.stringify(sent) !== JSON.stringify(e.sentLocation)) errors.push('sent location ' + JSON.stringify(sent));
      }
      if (e.confirmed && JSON.stringify(log.confirmed) !== JSON.stringify(e.confirmed)) errors.push('confirm ' + JSON.stringify(log.confirmed));
      if (e.choices && JSON.stringify(choices(doc())) !== JSON.stringify(e.choices)) errors.push('choices ' + JSON.stringify(choices(doc())));
      var when = function (what) { var m = log.timeline.find(function (x) { return x.what === what; }); return m ? m.t : null; };
      if (e.locationDuringStatus) {
        var asked = when('location-requested'), answered = when('answered:status');
        if (asked === null || answered === null || asked >= answered) errors.push('location not requested while status loaded ' + JSON.stringify(log.timeline));
      }
      if (e.locationAfterStatus) {
        var asked2 = when('location-requested'), answered2 = when('answered:status');
        if (asked2 === null || answered2 === null || asked2 < answered2) errors.push('location requested before status answered ' + JSON.stringify(log.timeline));
      }
      if (e.noLocationRequest && when('location-requested') !== null) errors.push('location was requested');
      if (e.noBrowserLocation && when('browser-location') !== null) errors.push('browser geolocation was used');
      if (e.vias && JSON.stringify(log.vias) !== JSON.stringify(e.vias)) errors.push('vias ' + JSON.stringify(log.vias));
      if (e.viasStart && JSON.stringify(log.vias.slice(0, e.viasStart.length)) !== JSON.stringify(e.viasStart)) errors.push('vias ' + JSON.stringify(log.vias));
      if (e.locationRequests !== undefined) {
        var n = log.timeline.filter(function (x) { return x.what === 'location-requested'; }).length;
        if (n !== e.locationRequests) errors.push('location requested ' + n + ' times');
      }
      if (e.inputValue !== undefined) {
        var inp = doc().getElementById('full-name');
        var v = inp ? inp.value : null;
        if (v !== e.inputValue) errors.push('name field ' + JSON.stringify(v));
      }
      if (e.inputValues) {
        Object.keys(e.inputValues).forEach(function (id) {
          var f = doc().getElementById(id);
          if (!f || f.value !== e.inputValues[id]) errors.push('field ' + id + ' ' + JSON.stringify(f ? f.value : null));
        });
      }
      if (e.placeholder !== undefined) {
        var ph = doc().getElementById('full-name');
        if (!ph || ph.placeholder !== e.placeholder) errors.push('placeholder ' + JSON.stringify(ph && ph.placeholder));
      }
      (e.invalid || []).forEach(function (id) {
        var f = doc().getElementById(id);
        if (!f || f.getAttribute('aria-invalid') !== 'true') errors.push(id + ' not marked invalid');
        var said = f && (f.getAttribute('aria-describedby') || '').split(' ').map(function (d) { return doc().getElementById(d); });
        if (!said || !said[0] || said[0].className !== 'field-error') errors.push(id + ' error not linked');
      });
      if (e.focusId && doc().activeElement && doc().activeElement.id !== e.focusId) errors.push('focus on ' + (doc().activeElement.id || doc().activeElement.tagName));
      if (e.sentSettings) {
        var sets = log.calls.filter(function (c) { return c.action === 'saveSettings'; });
        var lastSet = sets[sets.length - 1];
        // Exactly the fields sent (key order aside): an unchanged field must not be sent.
        var sorted = function (o) { return o && JSON.stringify(Object.keys(o).sort().map(function (k) { return [k, o[k]]; })); };
        var gotSet = lastSet ? ['sessionMinutes', 'lateMinutes', 'radiusM', 'maxAccuracyM'].reduce(function (o, k) {
          if (lastSet[k] !== undefined) o[k] = lastSet[k];
          return o;
        }, {}) : null;
        if (sorted(gotSet) !== sorted(e.sentSettings)) errors.push('saved settings ' + JSON.stringify(gotSet));
        if (!lastSet || !/^[A-Za-z0-9_-]{8,40}$/.test(lastSet.saveId || '')) errors.push('save without a valid saveId');
      }
      if (e.oneSaveId) {
        var ids = log.calls.filter(function (c) { return c.action === 'saveSettings'; }).map(function (c) { return c.saveId; });
        if (ids.length < 2 || !/^[A-Za-z0-9_-]{8,40}$/.test(ids[0] || '') || ids.some(function (id) { return id !== ids[0]; })) {
          errors.push('copies of one save carry ids ' + JSON.stringify(ids));
        }
      }
      if (e.enabled && doc().querySelector('#app button:disabled, #app input:disabled')) errors.push('controls left disabled');
      if (e.inView) {
        var box = doc().getElementById(e.inView);
        var r = box && box.getBoundingClientRect();
        var bar = doc().getElementById('actions').getBoundingClientRect();
        if (!r || r.top < 0 || r.bottom > bar.top) errors.push(e.inView + ' not in view (' + (r && Math.round(r.top)) + '-' + (r && Math.round(r.bottom)) + ', bar at ' + Math.round(bar.top) + ')');
      }
      if (e.haptics && JSON.stringify(log.haptics) !== JSON.stringify(e.haptics)) errors.push('haptics ' + JSON.stringify(log.haptics));
      if (e.peeks) {
        // The field's label shows above the bar (and its fade), so it reads as "more below".
        var field = doc().getElementById(e.peeks).closest('.field').getBoundingClientRect();
        var barTop = doc().getElementById('actions').getBoundingClientRect().top;
        if (!(field.top + 24 <= barTop - 32)) errors.push(e.peeks + ' does not peek out (field at ' + Math.round(field.top) + ', bar at ' + Math.round(barTop) + ')');
      }
      if (e.lineHidden !== undefined) {
        var intro = doc().querySelector('#screen .line');
        if (!intro || intro.hidden !== e.lineHidden) errors.push('line hidden: ' + (intro ? intro.hidden : 'no line'));
      }
      if (e.backVisible !== undefined && log.backVisible !== e.backVisible) errors.push('back button visible: ' + log.backVisible);
      if (e.closingConfirmation !== undefined && !!log.closingConfirmation !== e.closingConfirmation) errors.push('closing confirmation: ' + log.closingConfirmation);
      if (e.sentProfile) {
        var saves = log.calls.filter(function (c) { return c.action === 'saveProfile'; });
        var last = saves[saves.length - 1];
        var got = last ? Object.keys(e.sentProfile).reduce(function (o, k) { o[k] = last[k]; return o; }, {}) : null;
        if (JSON.stringify(got) !== JSON.stringify(e.sentProfile)) errors.push('saved profile ' + JSON.stringify(got));
      }
      if (e.startLocation) {
        var starts = log.calls.filter(function (c) { return c.action === 'startSession' || c.action === 'moveSite'; }).map(function (c) { return c.location; });
        if (JSON.stringify(starts[0]) !== JSON.stringify(e.startLocation)) errors.push('point sent ' + JSON.stringify(starts[0]));
      }
      if (e.openedSettings !== undefined && log.openedSettings !== e.openedSettings) errors.push('openSettings x' + log.openedSettings);
      if (e.closed !== undefined && log.closed !== e.closed) errors.push('close x' + log.closed);
      if (doc().querySelector('#screen img')) errors.push('user text rendered as HTML');
      if (e.focusInApp && !doc().getElementById('app').contains(doc().activeElement)) errors.push('focus lost to ' + doc().activeElement.tagName);
      if (win().document.documentElement.scrollWidth > win().innerWidth) errors.push('horizontal overflow');
    }
    frame.remove();
    return { name: name, pass: errors.length === 0, errors: errors };
  }

  (async function () {
    var names = Object.keys(SCENARIOS);
    var only = new URLSearchParams(location.search).get('only');
    if (only) names = names.filter(function (n) { return n === only; });
    // Focus lives in one frame at a time, so scenarios that check focus run one by one afterwards.
    var focusChecks = names.filter(function (n) { return SCENARIOS[n].expect.focusInApp; });
    var results = await Promise.all(names.filter(function (n) { return focusChecks.indexOf(n) === -1; }).map(run));
    for (var i = 0; i < focusChecks.length; i++) results.push(await run(focusChecks[i]));
    var table = document.getElementById('results');
    results.forEach(function (r) {
      var row = table.insertRow();
      row.insertCell().textContent = r.name;
      var c = row.insertCell();
      c.textContent = r.pass ? 'pass' : 'FAIL: ' + r.errors.join('; ');
      c.className = r.pass ? 'pass' : 'fail';
    });
    var failed = results.filter(function (r) { return !r.pass; }).length;
    document.getElementById('summary').textContent = (results.length - failed) + '/' + results.length + ' scenarios passed';
    window.__results = { total: results.length, failed: failed, results: results };
  })();
</script>
